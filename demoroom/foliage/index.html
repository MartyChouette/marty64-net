<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iPhone true fullscreen: Add to Home Screen -> launch from icon runs standalone
       with no Safari chrome (Fullscreen API is blocked for canvas in iPhone Safari). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Enjin Game</title>
  <meta property="og:title" content="Enjin Game">
  <meta property="og:type" content="game">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0" oncontextmenu="return false"></canvas>
    <div id="preloader">
      <div id="tege-wordmark">TEGE</div>
      <div id="progress-container">
        <div id="progress-bar"></div>
        <div id="tege-cube"></div>
      </div>
      <div id="progress-text">loading engine</div>
      <div id="click-to-play" style="display:none;">&#9654; &nbsp;Click to Play</div>
    </div>
    <button id="fullscreen-btn" title="Fullscreen">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="white">
        <path d="M3 3h5v2H5v3H3V3zm9 0h5v5h-2V5h-3V3zM3 12h2v3h3v2H3v-5zm12 3h-3v2h5v-5h-2v3z"/>
      </svg>
    </button>
  </div>

  <script src="preloader.js"></script>
  <script>
    // Emscripten module configuration (WebGPU)
    var Module = {
      locateFile: function(path, prefix) { return (prefix||'') + path + '?v=20260903y'; },
      canvas: (function() {
        var c = document.getElementById('game-canvas');
        // Request WebGPU context (Emscripten's USE_WEBGPU=1 expects this)
        if (navigator.gpu) {
          c.getContext('webgpu');
        }
        return c;
      })(),
      onRuntimeInitialized: function() {
        _runtimeReady = true;
        console.log('Enjin Game - Engine initialized');
        if (typeof hidePreloader === 'function') hidePreloader();
      },
      setStatus: function(text) {
        if (text) console.log(text);
        if (typeof updateProgress === 'function') {
          var m = text.match(/([\d.]+)\/([\d.]+)/);
          if (m) updateProgress(parseInt(m[1]) / parseInt(m[2]));
        }
      }
    };

    var _runtimeReady = false;
    function _syncCanvasSize() {
      var el = document.getElementById('game-container');
      var dpr = window.devicePixelRatio || 1;
      var w = Math.floor(el.clientWidth);
      var h = Math.floor(el.clientHeight);
      // Long-edge cap in DEVICE pixels. The old form floored eff at 1, so any
      // container wider than the cap rendered at full window resolution and the
      // cap did nothing at all - a 2560-wide window drew 3.7M pixels. Allowing
      // eff below 1 is what actually bounds the cost; 0.55 keeps it from going
      // soft enough to notice. 1280 keeps phones byte-identical to the tuning that
      // fixed the mobile OOM; only oversized desktop windows change.
      var ENJIN_MAX_EDGE = 1280;
      var eff = Math.max(0.55, Math.min(dpr, ENJIN_MAX_EDGE / Math.max(w, h)));
      // Ignore a collapsed box: layout reports one for a frame or two during
      // fullscreen transitions and before CSS settles, and committing it makes
      // the engine rebuild every render target at that size.
      if (w < 64 || h < 64) return;
      var c = document.getElementById('game-canvas');
      c.width = Math.floor(w * eff);
      c.height = Math.floor(h * eff);
      if (_runtimeReady && Module._onCanvasResize) Module._onCanvasResize(w, h, eff);
    }
    var _ro = new ResizeObserver(function() { _syncCanvasSize(); });
    _ro.observe(document.getElementById('game-container'));

    // Belt-and-suspenders: some browsers (notably Safari) don't reliably fire
    // ResizeObserver on fullscreen enter/exit — force a resize on the event too.
    document.addEventListener('fullscreenchange', function() { setTimeout(_syncCanvasSize, 60); });
    document.addEventListener('webkitfullscreenchange', function() { setTimeout(_syncCanvasSize, 60); });

    // Toggle fullscreen, falling back to CSS pseudo-fullscreen on iPhone Safari
    // (the Fullscreen API is unavailable there for non-video elements).
    // Exposed on window so the engine's touch/first-touch triggers reuse it.
    function _pseudoFS(on) {
      document.getElementById('game-container').classList.toggle('pseudo-fullscreen', on);
      setTimeout(_syncCanvasSize, 60);
    }
    window.enjinToggleFullscreen = function() {
      var el = document.getElementById('game-container');
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
        return;
      }
      if (el.classList.contains('pseudo-fullscreen')) { _pseudoFS(false); return; }
      if (el.requestFullscreen) { el.requestFullscreen().catch(function(){ _pseudoFS(true); }); }
      else if (el.webkitRequestFullscreen) { try { el.webkitRequestFullscreen(); } catch (e) { _pseudoFS(true); } }
      else { _pseudoFS(true); }   // iPhone Safari path
    };
    // Engine touch/first-touch gestures want to ENTER only (never toggle off).
    window.enjinEnterFullscreen = function() {
      var el = document.getElementById('game-container');
      if (document.fullscreenElement || document.webkitFullscreenElement ||
          el.classList.contains('pseudo-fullscreen')) return;
      window.enjinToggleFullscreen();
    };
    document.getElementById('fullscreen-btn').addEventListener('click', window.enjinToggleFullscreen);
  </script>
  <script src="EnjinPlayer.js?v=20260903y"></script>
</body>
</html>
