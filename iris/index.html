<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Iris Trimming</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #1a1a2e; touch-action: none;
  font-family: 'Georgia', serif;
}
canvas { display: block; }
#ui {
  position: absolute; top: 0; left: 0; width: 100%;
  pointer-events: none; padding: 12px;
  display: flex; justify-content: space-between; align-items: flex-start;
}
#score {
  color: #c8e6c9; font-size: 14px;
  background: rgba(0,0,0,0.4); padding: 6px 12px;
  border-radius: 8px; line-height: 1.5;
}
#tool-select {
  pointer-events: all; display: flex; gap: 6px;
}
.tool-btn {
  background: rgba(0,0,0,0.5); color: #c8e6c9;
  border: 2px solid #4a7c59; border-radius: 8px;
  padding: 8px 12px; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
}
.tool-btn.active { background: #4a7c59; color: #fff; }
.tool-btn:hover { border-color: #6aad75; }
#angle-indicator {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: #c8e6c9; font-size: 13px;
  background: rgba(0,0,0,0.4); padding: 6px 14px;
  border-radius: 8px; opacity: 0; transition: opacity 0.3s;
}
#restart-btn, #keep-btn {
  position: absolute; bottom: 12px;
  pointer-events: all; background: rgba(0,0,0,0.5);
  color: #c8e6c9; border: 2px solid #4a7c59;
  border-radius: 8px; padding: 8px 14px; font-size: 13px;
  cursor: pointer; font-family: inherit;
}
#restart-btn { right: 12px; }
#keep-btn { right: 120px; border-color: #7b5ea7; }
#keep-btn:hover { background: #7b5ea7; color: #fff; }
#restart-btn:hover { background: #4a7c59; color: #fff; }
#bouquet-toggle {
  position: absolute; bottom: 12px; left: 12px;
  pointer-events: all; background: rgba(0,0,0,0.5);
  color: #c8e6c9; border: 2px solid #8d6e63;
  border-radius: 8px; padding: 8px 14px; font-size: 13px;
  cursor: pointer; font-family: inherit;
}
#bouquet-toggle:hover { background: #8d6e63; color: #fff; }
#bouquet-panel {
  position: absolute; top: 0; right: 0;
  width: 100%; height: 100%;
  background: rgba(15, 15, 30, 0.95);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
}
#bouquet-panel.open { display: flex; }
#bouquet-canvas { max-width: 100%; max-height: 85%; }
#bouquet-header {
  color: #c8e6c9; font-size: 18px; padding: 12px;
  text-align: center;
}
#bouquet-close {
  position: absolute; top: 12px; right: 12px;
  background: rgba(0,0,0,0.5); color: #c8e6c9;
  border: 2px solid #8d6e63; border-radius: 8px;
  padding: 8px 14px; font-size: 13px; cursor: pointer;
  font-family: inherit; z-index: 11;
}
#bouquet-close:hover { background: #8d6e63; color: #fff; }
#design-egg {
  position: fixed; bottom: 14px; right: 14px;
  color: #c8e6c9; opacity: 0.1;
  transition: opacity 0.4s, transform 0.3s;
  text-decoration: none; z-index: 5;
  display: block; line-height: 0;
}
#design-egg:hover { opacity: 0.8; transform: scale(1.2); }
#design-egg svg { width: 16px; height: 16px; display: block; }
@media (max-width: 768px) {
  #design-egg { bottom: 50px; right: 10px; }
  #design-egg svg { width: 14px; height: 14px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">
    <div>Trimmed: <span id="trim-count">0</span></div>
    <div>Health: <span id="health">100</span>%</div>
  </div>
  <div id="tool-select">
    <button class="tool-btn active" data-tool="pluck">Pluck</button>
    <button class="tool-btn" data-tool="slice">Shears</button>
  </div>
</div>
<div id="angle-indicator"></div>
<button id="keep-btn">Keep in Bouquet</button>
<button id="restart-btn">New Iris</button>
<button id="bouquet-toggle">Bouquet (0)</button>
<a href="design.html" id="design-egg" aria-label="Design Document">
  <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
    <rect x="3" y="1" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.3"/>
    <line x1="6" y1="6" x2="14" y2="6" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="9" x2="14" y2="9" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="12" x2="11" y2="12" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <circle cx="13" cy="15" r="2" fill="currentColor" opacity="0.3"/>
  </svg>
</a>
<div id="bouquet-panel">
  <div id="bouquet-header">Your Bouquet</div>
  <canvas id="bouquet-canvas"></canvas>
  <button id="bouquet-close">Back to Trimming</button>
</div>

<script>
// ── Canvas Setup ──
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, scale;

// Cached background - only redrawn on resize
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
let bgDirty = true;

// Cached DOM refs
const trimCountEl = document.getElementById('trim-count');
const healthEl = document.getElementById('health');
const angleIndicator = document.getElementById('angle-indicator');
const bouquetToggleEl = document.getElementById('bouquet-toggle');

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H;
  scale = Math.min(W / 400, H / 800);
  bgDirty = true;
}
resize();
window.addEventListener('resize', resize);

// ── Pre-computed color LUT ──
function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
  const br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
  return `rgb(${ar + (br - ar) * t + 0.5 | 0},${ag + (bg - ag) * t + 0.5 | 0},${ab + (bb - ab) * t + 0.5 | 0})`;
}

// ── State ──
let tool = 'pluck';
let trimCount = 0;
let health = 100;
let slicing = false;
let dragging = null;
let mousePos = { x: 0, y: 0 };
let wind = 0;
let windTarget = 0;
let windTimer = 0;
let flower = null;
let bouquet = [];

// ── Particle Pool (swap-and-pop, pre-allocated) ──
const MAX_PARTICLES = 500;
const MAX_FALLING = 30;
const particles = new Array(MAX_PARTICLES);
let particleCount = 0;
const fallingParts = new Array(MAX_FALLING);
let fallingCount = 0;

// Slice trail as ring buffer
const TRAIL_MAX = 30;
const sliceTrail = new Array(TRAIL_MAX);
let trailHead = 0;
let trailLen = 0;

function trailPush(p) {
  sliceTrail[trailHead] = p;
  trailHead = (trailHead + 1) % TRAIL_MAX;
  if (trailLen < TRAIL_MAX) trailLen++;
}
function trailGet(i) {
  // i=0 is oldest, i=trailLen-1 is newest
  return sliceTrail[(trailHead - trailLen + i + TRAIL_MAX) % TRAIL_MAX];
}
function trailClear() { trailLen = 0; }

// ── Tool buttons ──
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
  });
});
document.getElementById('restart-btn').addEventListener('click', init);

document.getElementById('keep-btn').addEventListener('click', () => {
  snapshotToBouquet();
  init();
});

document.getElementById('bouquet-toggle').addEventListener('click', () => {
  if (bouquet.length === 0) return;
  document.getElementById('bouquet-panel').classList.add('open');
  renderBouquet();
});

document.getElementById('bouquet-close').addEventListener('click', () => {
  document.getElementById('bouquet-panel').classList.remove('open');
});

function snapshotToBouquet() {
  bouquet.push({
    flower: JSON.parse(JSON.stringify(flower)),
    health, trimCount,
    origW: W, origH: H, origScale: scale, origCx: cx,
  });
  bouquetToggleEl.textContent = `Bouquet (${bouquet.length})`;
}

function renderFlowerToCanvas(entry) {
  const fw = 220, fh = 440;
  const offscreen = document.createElement('canvas');
  offscreen.width = fw;
  offscreen.height = fh;
  const oc = offscreen.getContext('2d');

  const savedW = W, savedH = H, savedCx = cx;
  const savedScale = scale, savedFlower = flower, savedWind = wind;
  const mainImageData = ctx.getImageData(0, 0, savedW, savedH);

  flower = entry.flower;
  wind = 0;
  W = entry.origW; H = entry.origH;
  cx = entry.origCx; scale = entry.origScale;

  ctx.clearRect(0, 0, W, H);
  drawStem();
  for (let i = 0; i < flower.leaves.length; i++) drawLeaf(flower.leaves[i]);
  for (let i = 0; i < flower.falls.length; i++) drawPetal(flower.falls[i]);
  for (let i = 0; i < flower.standards.length; i++) drawPetal(flower.standards[i]);

  const flowerTop = flower.stemTopY - 80 * scale;
  const flowerBot = flower.stemBaseY + 10 * scale;
  const flowerH = flowerBot - flowerTop;
  const flowerW = 220 * scale;
  const srcX = Math.max(0, flower.stemX - flowerW / 2);
  const srcY = Math.max(0, flowerTop);
  const srcW = Math.min(flowerW, W - srcX);
  const srcH = Math.min(flowerH, H - srcY);

  const drawFit = Math.min(fw / srcW, fh / srcH) * 0.9;
  const dw = srcW * drawFit, dh = srcH * drawFit;
  oc.drawImage(canvas, srcX, srcY, srcW, srcH, (fw - dw) / 2, (fh - dh) / 2, dw, dh);

  ctx.putImageData(mainImageData, 0, 0);
  flower = savedFlower; wind = savedWind;
  W = savedW; H = savedH; cx = savedCx; scale = savedScale;
  return offscreen;
}

function renderBouquet() {
  const bc = document.getElementById('bouquet-canvas');
  const bctx = bc.getContext('2d');
  const count = bouquet.length;
  const maxW = Math.min(window.innerWidth, 800);
  const maxH = Math.min(window.innerHeight * 0.8, 700);
  bc.width = maxW; bc.height = maxH;

  const bg = bctx.createLinearGradient(0, 0, 0, maxH);
  bg.addColorStop(0, '#2a1a3a'); bg.addColorStop(1, '#1a1a2e');
  bctx.fillStyle = bg;
  bctx.fillRect(0, 0, maxW, maxH);

  const vaseY = maxH * 0.72, vaseCx = maxW / 2;
  const paperGrad = bctx.createLinearGradient(vaseCx - 100, vaseY, vaseCx + 100, vaseY);
  paperGrad.addColorStop(0, '#5d4037');
  paperGrad.addColorStop(0.5, '#8d6e63');
  paperGrad.addColorStop(1, '#5d4037');

  bctx.beginPath();
  bctx.moveTo(vaseCx - 130, vaseY - 30);
  bctx.lineTo(vaseCx - 40, maxH);
  bctx.lineTo(vaseCx + 40, maxH);
  bctx.lineTo(vaseCx + 130, vaseY - 30);
  bctx.closePath();
  bctx.fillStyle = paperGrad;
  bctx.fill();

  bctx.strokeStyle = 'rgba(255,255,255,0.08)';
  bctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const x = vaseCx - 100 + i * 28;
    bctx.beginPath();
    bctx.moveTo(x, vaseY - 20);
    bctx.lineTo(x - 15, maxH);
    bctx.stroke();
  }

  if (count > 0) {
    const rendered = bouquet.map(e => renderFlowerToCanvas(e));
    const fanSpread = Math.min(Math.PI * 0.7, count * 0.18 + 0.25);
    const startAngle = -Math.PI / 2 - fanSpread / 2;
    const angleStep = count > 1 ? fanSpread / (count - 1) : 0;

    for (let i = 0; i < count; i++) {
      const img = rendered[i];
      const angle = count === 1 ? -Math.PI / 2 : startAngle + angleStep * i;
      bctx.save();
      bctx.translate(vaseCx, vaseY - 10);
      bctx.rotate(angle + Math.PI / 2);
      const fw = img.width * 0.6, fh = img.height * 0.6;
      bctx.drawImage(img, -fw / 2, -fh, fw, fh);
      bctx.restore();
    }
  }

  bctx.beginPath();
  bctx.moveTo(vaseCx - 90, vaseY);
  bctx.lineTo(vaseCx - 35, maxH);
  bctx.lineTo(vaseCx + 35, maxH);
  bctx.lineTo(vaseCx + 90, vaseY);
  bctx.closePath();
  bctx.fillStyle = paperGrad;
  bctx.fill();

  bctx.beginPath();
  bctx.ellipse(vaseCx, vaseY + 5, 95, 15, 0, 0, Math.PI * 2);
  bctx.fillStyle = '#c62828';
  bctx.fill();
  bctx.beginPath();
  bctx.ellipse(vaseCx - 25, vaseY - 8, 22, 13, -0.3, 0, Math.PI * 2);
  bctx.fillStyle = '#e53935';
  bctx.fill();
  bctx.beginPath();
  bctx.ellipse(vaseCx + 25, vaseY - 8, 22, 13, 0.3, 0, Math.PI * 2);
  bctx.fillStyle = '#e53935';
  bctx.fill();
  bctx.beginPath();
  bctx.arc(vaseCx, vaseY, 7, 0, Math.PI * 2);
  bctx.fillStyle = '#b71c1c';
  bctx.fill();

  bctx.fillStyle = '#c8e6c9';
  bctx.font = '14px Georgia';
  bctx.textAlign = 'center';
  bctx.fillText(`${count} flower${count !== 1 ? 's' : ''} collected`, vaseCx, maxH - 15);
}

// ── Flower Generation ──
function createFlower() {
  const stemBaseY = H * 0.88;
  const stemTopY = H * 0.28;
  const stemX = cx;

  const leaves = [];
  const leafCount = 4 + (Math.random() * 3 | 0);
  for (let i = 0; i < leafCount; i++) {
    const t = 0.15 + (i / leafCount) * 0.7;
    const y = stemTopY + (stemBaseY - stemTopY) * t;
    const side = (i % 2 === 0) ? -1 : 1;
    const len = (35 + Math.random() * 25) * scale;
    const width = (8 + Math.random() * 6) * scale;
    const dying = Math.random() < 0.45;
    const droop = dying ? (0.3 + Math.random() * 0.5) : (Math.random() * 0.15);
    const brownness = dying ? (0.4 + Math.random() * 0.6) : 0;
    // Pre-compute color instead of lerpColor every frame
    let color;
    if (brownness > 0.5) {
      color = lerpColor('#8B6914', '#654321', (brownness - 0.5) * 2);
    } else {
      color = lerpColor('#3d8822', '#8B6914', brownness * 2);
    }
    const veinColor = brownness > 0.5 ? 'rgba(80, 50, 20, 0.3)' : 'rgba(30, 80, 15, 0.4)';
    // Pre-bake dying spot positions
    let spots = null;
    if (dying) {
      spots = [];
      for (let j = 0; j < 3; j++) {
        spots.push({
          tx: 0.2 + j * 0.3,
          offX: (Math.random() - 0.5),
          r: (2 + Math.random() * 3),
        });
      }
    }
    const baseAngle = side * (0.3 + Math.random() * 0.4);
    leaves.push({
      x: stemX, y, side, len, width, droop,
      dying, removed: false, removing: false,
      tearProgress: 0, angle: baseAngle, baseAngle,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 1.5 + Math.random() * 0.5,
      brownness, color, veinColor, spots,
    });
  }

  const falls = [];
  const standards = [];
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2 - Math.PI / 2;
    const rotting = Math.random() < 0.35;
    const brownness = rotting ? (0.3 + Math.random() * 0.5) : 0;
    let spots = null;
    if (rotting) {
      spots = [];
      for (let j = 0; j < 5; j++) {
        spots.push({
          t: 0.2 + Math.random() * 0.6,
          offX: (Math.random() - 0.5),
          offY: (Math.random() - 0.5) * 0.3,
          r: 2 + Math.random() * 4,
        });
      }
    }
    standards.push({
      type: 'standard', angle, baseAngle: angle,
      x: stemX, y: stemTopY,
      len: (55 + Math.random() * 15) * scale,
      width: (22 + Math.random() * 8) * scale,
      rotting, removed: false, removing: false,
      tearProgress: 0, sway: Math.random() * Math.PI * 2,
      swaySpeed: 1.2 + Math.random() * 0.3,
      brownness, rufflePhase: Math.random() * Math.PI * 2,
      fillColor: brownness > 0 ? lerpColor('#7b1fa2', '#5d4037', brownness) : null,
      spots,
    });
  }
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2 + Math.PI / 6;
    const rotting = Math.random() < 0.4;
    const brownness = rotting ? (0.3 + Math.random() * 0.5) : 0;
    let spots = null;
    if (rotting) {
      spots = [];
      for (let j = 0; j < 5; j++) {
        spots.push({
          t: 0.2 + Math.random() * 0.6,
          offX: (Math.random() - 0.5),
          offY: (Math.random() - 0.5) * 0.3,
          r: 2 + Math.random() * 4,
        });
      }
    }
    falls.push({
      type: 'fall', angle, baseAngle: angle,
      x: stemX, y: stemTopY,
      len: (50 + Math.random() * 15) * scale,
      width: (18 + Math.random() * 8) * scale,
      rotting, removed: false, removing: false,
      tearProgress: 0, sway: Math.random() * Math.PI * 2,
      swaySpeed: 1.2 + Math.random() * 0.3,
      brownness, beardPhase: Math.random() * Math.PI * 2,
      rufflePhase: Math.random() * Math.PI * 2,
      fillColor: brownness > 0 ? lerpColor('#7b1fa2', '#5d4037', brownness) : null,
      spots,
    });
  }

  const stemSegments = [];
  const segCount = 8;
  for (let i = 0; i <= segCount; i++) {
    const t = i / segCount;
    stemSegments.push({
      x: stemX,
      y: stemTopY + (stemBaseY - stemTopY) * t,
      baseX: stemX,
    });
  }

  return {
    stemX, stemTopY, stemBaseY, stemSegments,
    stemCut: false, stemCutY: 0, stemCutAngle: 0,
    leaves, falls, standards,
    // Combined for hit-testing (petals = all petals)
    petals: standards.concat(falls),
    swayPhase: 0,
    stemWidth: 5 * scale,
  };
}

function init() {
  flower = createFlower();
  particleCount = 0;
  fallingCount = 0;
  trailClear();
  slicing = false;
  trimCount = 0;
  health = 100;
  updateUI();
}

function updateUI() {
  trimCountEl.textContent = trimCount;
  healthEl.textContent = health;
}

// ── Particle System (pooled) ──
function addParticle(x, y, vx, vy, life, decay, size, color, gravity, type) {
  if (particleCount >= MAX_PARTICLES) return;
  const p = particles[particleCount];
  if (p) {
    p.x = x; p.y = y; p.vx = vx; p.vy = vy;
    p.life = life; p.decay = decay; p.size = size;
    p.color = color; p.gravity = gravity; p.type = type;
  } else {
    particles[particleCount] = { x, y, vx, vy, life, decay, size, color, gravity, type };
  }
  particleCount++;
}

const chloroColors = ['#2d5a1e', '#4a8c2a', '#6dbf3b'];
const streamColors = ['#1a4a0e', '#2d6b1e', '#4a9c2a', '#3d8822'];

function spawnChlorophyll(x, y, count, vel) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * 6.2832;
    const s = (vel || 2) * (0.5 + Math.random() * 1.5);
    addParticle(x, y,
      Math.cos(a) * s + (Math.random() - 0.5) * 2,
      Math.sin(a) * s - Math.random() * 3,
      1, 0.008 + Math.random() * 0.015,
      (2 + Math.random() * 4) * scale,
      chloroColors[Math.random() * 3 | 0],
      0.08 + Math.random() * 0.05, 0);
  }
}

function spawnChlorophyllStream(x, y, dirX, dirY, count) {
  for (let i = 0; i < count; i++) {
    const s = 3 + Math.random() * 5;
    addParticle(
      x + (Math.random() - 0.5) * 6,
      y + (Math.random() - 0.5) * 6,
      dirX * s + (Math.random() - 0.5) * 0.5 * s,
      dirY * s + (Math.random() - 0.5) * 0.5 * s - 1,
      1, 0.01 + Math.random() * 0.012,
      (3 + Math.random() * 5) * scale,
      streamColors[Math.random() * 4 | 0],
      0.12, 0);
  }
}

function spawnDroplets(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = -1.5708 + (Math.random() - 0.5) * 2.5133;
    const s = 2 + Math.random() * 4;
    const g = 120 + (Math.random() * 60 | 0);
    addParticle(x, y,
      Math.cos(a) * s, Math.sin(a) * s,
      1, 0.005 + Math.random() * 0.008,
      (1.5 + Math.random() * 3) * scale,
      `rgba(45,${g},30,0.8)`, 0.15, 1);
  }
}

// ── Falling Parts (pooled) ──
function dropPart(part, type) {
  if (fallingCount >= MAX_FALLING) return;
  const f = fallingParts[fallingCount];
  const data = {
    x: part.x, y: part.y, partType: type,
    width: part.width, len: part.len,
    rotting: part.rotting, dying: part.dying,
    vx: (Math.random() - 0.5) * 3,
    vy: -2 - Math.random() * 3,
    rotation: part.angle || 0,
    rotSpeed: (Math.random() - 0.5) * 0.1,
    gravity: 0.12, alpha: 1,
  };
  if (f) Object.assign(f, data);
  else fallingParts[fallingCount] = data;
  fallingCount++;
}

// ── Hit Testing ──
function pointNearLeaf(px, py, leaf) {
  if (leaf.removed) return false;
  const absAngle = Math.abs(leaf.angle);
  const tipX = leaf.x + leaf.side * Math.cos(absAngle) * leaf.len;
  const tipY = leaf.y + Math.sin(absAngle + leaf.droop) * leaf.len * 0.5;
  const dx = tipX - leaf.x, dy = tipY - leaf.y;
  const lenSq = dx * dx + dy * dy;
  const t = Math.max(0, Math.min(1, ((px - leaf.x) * dx + (py - leaf.y) * dy) / lenSq));
  const cx = leaf.x + t * dx, cy = leaf.y + t * dy;
  const d2 = (px - cx) * (px - cx) + (py - cy) * (py - cy);
  const threshold = leaf.width * 2;
  return d2 < threshold * threshold;
}

function pointNearPetal(px, py, petal) {
  if (petal.removed) return false;
  const isStd = petal.type === 'standard';
  const dirX = isStd ? Math.sin(petal.angle) * 0.3 : Math.sin(petal.angle) * 0.5;
  const dirY = isStd ? -1 : 0.6;
  const tipX = petal.x + dirX * petal.len;
  const tipY = petal.y + dirY * petal.len;
  const dx = tipX - petal.x, dy = tipY - petal.y;
  const lenSq = dx * dx + dy * dy;
  const t = Math.max(0, Math.min(1, ((px - petal.x) * dx + (py - petal.y) * dy) / lenSq));
  const cx = petal.x + t * dx, cy = petal.y + t * dy;
  const d2 = (px - cx) * (px - cx) + (py - cy) * (py - cy);
  const threshold = petal.width * 2;
  return d2 < threshold * threshold;
}

function lineIntersectsStem(x1, y1, x2, y2) {
  if (flower.stemCut) return null;
  const segs = flower.stemSegments;
  for (let i = 0, n = segs.length - 1; i < n; i++) {
    const hit = lineLineIntersect(x1, y1, x2, y2, segs[i].x, segs[i].y, segs[i + 1].x, segs[i + 1].y);
    if (hit) { hit.segIndex = i; return hit; }
  }
  return null;
}

function lineLineIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
  const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
  if (denom > -0.001 && denom < 0.001) return null;
  const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
  const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
    return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1), t, u };
  }
  return null;
}

// ── Input ──
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const px = e.clientX, py = e.clientY;
  mousePos.x = px; mousePos.y = py;

  if (tool === 'pluck') {
    const petals = flower.petals;
    for (let i = petals.length - 1; i >= 0; i--) {
      if (!petals[i].removed && pointNearPetal(px, py, petals[i])) {
        dragging = { type: 'petal', part: petals[i] };
        petals[i].removing = true;
        return;
      }
    }
    const leaves = flower.leaves;
    for (let i = leaves.length - 1; i >= 0; i--) {
      if (!leaves[i].removed && pointNearLeaf(px, py, leaves[i])) {
        dragging = { type: 'leaf', part: leaves[i] };
        leaves[i].removing = true;
        return;
      }
    }
  } else {
    slicing = true;
    trailClear();
    trailPush({ x: px, y: py });
  }
});

canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  const px = e.clientX, py = e.clientY;
  mousePos.x = px; mousePos.y = py;

  if (dragging) {
    const part = dragging.part;
    if (!part.removed) {
      const dx = px - part.x, dy = py - part.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      part.tearProgress = Math.min(1, dist / (part.len * 1.8));

      if (part.tearProgress > 0.3 && Math.random() < 0.3) {
        spawnChlorophyll(part.x, part.y, 1, 1);
      }

      if (part.tearProgress >= 1) {
        part.removed = true;
        part.removing = false;
        const invD = 1 / dist;
        spawnChlorophyllStream(part.x, part.y, -dx * invD, -dy * invD, 25);
        spawnChlorophyll(part.x, part.y, 15, 3);
        spawnDroplets(part.x, part.y, 8);
        dropPart(part, dragging.type);
        trimCount++;
        if (dragging.type === 'petal' && !part.rotting) health = Math.max(0, health - 8);
        else if (dragging.type === 'leaf' && !part.dying) health = Math.max(0, health - 5);
        else health = Math.min(100, health + 3);
        updateUI();
        dragging = null;
      }
    }
  }

  if (slicing) {
    trailPush({ x: px, y: py });

    if (trailLen >= 2) {
      const last = trailGet(trailLen - 1);
      const prev = trailGet(trailLen - 2);
      const hit = lineIntersectsStem(prev.x, prev.y, last.x, last.y);
      if (hit) {
        const cutDx = last.x - prev.x, cutDy = last.y - prev.y;
        const cutAngle = Math.atan2(cutDy, cutDx);
        let relAngle = Math.abs(cutAngle) * 57.2958;
        if (relAngle > 90) relAngle = 180 - relAngle;

        flower.stemCut = true;
        flower.stemCutY = hit.y;
        flower.stemCutAngle = cutAngle;
        flower.stemCutSegIndex = hit.segIndex;

        spawnChlorophyllStream(hit.x, hit.y, 0, -1, 30);
        spawnChlorophyllStream(hit.x, hit.y, -0.5, -0.8, 20);
        spawnChlorophyllStream(hit.x, hit.y, 0.5, -0.8, 20);
        spawnChlorophyll(hit.x, hit.y, 25, 4);
        spawnDroplets(hit.x, hit.y, 15);

        const angleDiff = Math.abs(relAngle - 45);
        let rating;
        if (angleDiff < 5) { rating = 'Perfect 45\u00b0 cut!'; health = Math.min(100, health + 10); }
        else if (angleDiff < 15) { rating = `Good cut (${relAngle + 0.5 | 0}\u00b0)`; health = Math.min(100, health + 5); }
        else if (angleDiff < 30) { rating = `OK cut (${relAngle + 0.5 | 0}\u00b0) - aim for 45\u00b0`; }
        else { rating = `Bad angle (${relAngle + 0.5 | 0}\u00b0) - 45\u00b0 is ideal`; health = Math.max(0, health - 5); }
        angleIndicator.textContent = rating;
        angleIndicator.style.opacity = '1';
        setTimeout(() => angleIndicator.style.opacity = '0', 2500);

        trimCount++;
        updateUI();

        const leaves = flower.leaves;
        for (let i = 0; i < leaves.length; i++) {
          const l = leaves[i];
          if (!l.removed && l.y > hit.y) {
            l.removed = true;
            dropPart(l, 'leaf');
          }
        }
      }

      // Leaf slicing
      const last2 = trailGet(trailLen - 1);
      const prev2 = trailGet(trailLen - 2);
      const velSq = (last2.x - prev2.x) ** 2 + (last2.y - prev2.y) ** 2;
      if (velSq > 25) {
        const leaves = flower.leaves;
        for (let i = 0; i < leaves.length; i++) {
          const leaf = leaves[i];
          if (!leaf.removed && pointNearLeaf(last2.x, last2.y, leaf)) {
            leaf.removed = true;
            const invV = 1 / Math.sqrt(velSq);
            spawnChlorophyllStream(leaf.x, leaf.y, (last2.x - prev2.x) * invV * 0.75, (last2.y - prev2.y) * invV * 0.75, 15);
            spawnChlorophyll(leaf.x, leaf.y, 10, 2);
            dropPart(leaf, 'leaf');
            trimCount++;
            if (!leaf.dying) health = Math.max(0, health - 5);
            else health = Math.min(100, health + 3);
            updateUI();
          }
        }
      }
    }
  }
});

canvas.addEventListener('pointerup', () => {
  if (dragging) {
    const part = dragging.part;
    if (!part.removed) { part.removing = false; part.tearProgress = 0; }
    dragging = null;
  }
  slicing = false;
  setTimeout(trailClear, 200);
});

canvas.addEventListener('pointercancel', () => {
  dragging = null;
  slicing = false;
});

// ── Drawing ──
function rebuildBackground() {
  bgCanvas.width = W;
  bgCanvas.height = H;
  const grad = bgCtx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.4, '#B0E0E6');
  grad.addColorStop(0.7, '#90EE90');
  grad.addColorStop(1, '#228B22');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, W, H);
  // Static noise texture - baked once
  bgCtx.globalAlpha = 0.03;
  for (let i = 0; i < 50; i++) {
    bgCtx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
    bgCtx.fillRect(Math.random() * W, Math.random() * H, Math.random() * 3, Math.random() * 3);
  }
  bgCtx.globalAlpha = 1;
  bgDirty = false;
}

function drawStem() {
  const segs = flower.stemSegments;
  const sw = flower.stemWidth;
  const nSegs = segs.length;

  for (let i = 0; i < nSegs; i++) {
    const t = 1 - i / (nSegs - 1);
    segs[i].x = segs[i].baseX + wind * t * t * 30 * scale;
  }

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Main stem path
  ctx.beginPath();
  if (flower.stemCut) {
    ctx.moveTo(segs[0].x, segs[0].y);
    for (let i = 1; i <= flower.stemCutSegIndex; i++) {
      if (i < flower.stemCutSegIndex) {
        const xc = (segs[i].x + segs[i + 1].x) * 0.5;
        const yc = (segs[i].y + segs[i + 1].y) * 0.5;
        ctx.quadraticCurveTo(segs[i].x, segs[i].y, xc, yc);
      } else {
        ctx.lineTo(segs[i].x, flower.stemCutY);
      }
    }
  } else {
    ctx.moveTo(segs[0].x, segs[0].y);
    for (let i = 1; i < nSegs; i++) {
      if (i < nSegs - 1) {
        const xc = (segs[i].x + segs[i + 1].x) * 0.5;
        const yc = (segs[i].y + segs[i + 1].y) * 0.5;
        ctx.quadraticCurveTo(segs[i].x, segs[i].y, xc, yc);
      } else {
        ctx.lineTo(segs[i].x, segs[i].y);
      }
    }
  }

  const stemGrad = ctx.createLinearGradient(cx - sw, 0, cx + sw, 0);
  stemGrad.addColorStop(0, '#2d5a1e');
  stemGrad.addColorStop(0.3, '#4a8c2a');
  stemGrad.addColorStop(0.7, '#3d7a22');
  stemGrad.addColorStop(1, '#2a5518');
  ctx.strokeStyle = stemGrad;
  ctx.lineWidth = sw * 2;
  ctx.stroke();

  // Highlight
  ctx.beginPath();
  const endIdx = flower.stemCut ? flower.stemCutSegIndex : nSegs - 1;
  ctx.moveTo(segs[0].x - sw * 0.3, segs[0].y);
  for (let i = 1; i <= endIdx; i++) {
    ctx.lineTo(segs[i].x - sw * 0.3, (flower.stemCut && i === endIdx) ? flower.stemCutY : segs[i].y);
  }
  ctx.strokeStyle = 'rgba(120,200,80,0.3)';
  ctx.lineWidth = sw * 0.6;
  ctx.stroke();

  // Cut face
  if (flower.stemCut) {
    const cutSeg = segs[flower.stemCutSegIndex];
    ctx.save();
    ctx.translate(cutSeg.x, flower.stemCutY);
    ctx.rotate(flower.stemCutAngle);
    ctx.beginPath();
    ctx.ellipse(0, 0, sw * 1.5, sw * 0.8, 0, 0, 6.2832);
    ctx.fillStyle = '#8BC34A';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, 0, sw * 0.8, sw * 0.4, 0, 0, 6.2832);
    ctx.fillStyle = '#C5E1A5';
    ctx.fill();
    ctx.restore();

    if (Math.random() < 0.15) {
      spawnDroplets(cutSeg.x, flower.stemCutY, 1);
    }
  }
}

function drawLeaf(leaf) {
  if (leaf.removed) return;

  const sway = Math.sin(leaf.sway) * 0.05 + wind * 0.15;
  const currentAngle = leaf.baseAngle + sway;
  leaf.angle = currentAngle;

  ctx.save();
  ctx.translate(leaf.x, leaf.y);

  const dir = leaf.side;
  const absAngle = Math.abs(currentAngle);
  const tipX = dir * Math.cos(absAngle) * leaf.len;
  const tipY = Math.sin(absAngle + leaf.droop) * leaf.len * 0.5;

  const cp1x = tipX * 0.3;
  const cp1y = -leaf.width * 0.5 + tipY * 0.3;
  const cp2x = tipX * 0.7;
  const cp2y = -leaf.width * 0.3 + tipY * 0.7;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(cp1x, cp1y - leaf.width * 0.5, cp2x, cp2y - leaf.width * 0.3, tipX, tipY);
  ctx.bezierCurveTo(cp2x, cp2y + leaf.width * 0.3, cp1x, cp1y + leaf.width * 0.5, 0, 0);
  ctx.fillStyle = leaf.color;
  ctx.fill();

  // Vein
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(tipX * 0.5, tipY * 0.5, tipX, tipY);
  ctx.strokeStyle = leaf.veinColor;
  ctx.lineWidth = scale;
  ctx.stroke();

  // Tear indicator
  if (leaf.removing && leaf.tearProgress > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, 5 * scale, 0, 6.2832);
    ctx.fillStyle = `rgba(100,200,50,${leaf.tearProgress * 0.5})`;
    ctx.fill();
    ctx.globalAlpha = leaf.tearProgress * 0.3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(
      (mousePos.x - leaf.x) * leaf.tearProgress * 0.2,
      (mousePos.y - leaf.y) * leaf.tearProgress * 0.2
    );
    ctx.strokeStyle = '#4a8c2a';
    ctx.lineWidth = 3 * scale * (1 - leaf.tearProgress);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Pre-baked dying spots
  if (leaf.spots) {
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#4a3010';
    for (let i = 0; i < leaf.spots.length; i++) {
      const s = leaf.spots[i];
      ctx.beginPath();
      ctx.arc(tipX * s.tx + s.offX * leaf.width, tipY * s.tx, s.r * scale, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawPetal(petal) {
  if (petal.removed) return;

  const sway = Math.sin(petal.sway) * 0.03 + wind * 0.08;
  petal.angle = petal.baseAngle + sway;

  const topSeg = flower.stemSegments[0];
  petal.x = topSeg.x;
  petal.y = topSeg.y;

  ctx.save();
  ctx.translate(petal.x, petal.y);

  const isStd = petal.type === 'standard';
  const dirX = isStd ? Math.sin(petal.angle) * 0.4 : Math.sin(petal.angle) * 0.7;
  const dirY = isStd ? -1 : 0.5;
  const tipX = dirX * petal.len;
  const tipY = dirY * petal.len;

  const perpX = -dirY;
  const perpY = dirX;
  const w = petal.width;

  // Build petal outline
  ctx.beginPath();
  const steps = 8;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const bx = tipX * t, by = tipY * t;
    const widthAtT = Math.sin(t * 3.1416) * w;
    const ruffle = Math.sin(t * 6 + (petal.rufflePhase || 0)) * w * 0.15;
    const px = bx + perpX * (widthAtT + ruffle);
    const py = by + perpY * (widthAtT + ruffle);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  for (let i = steps; i >= 0; i--) {
    const t = i / steps;
    const bx = tipX * t, by = tipY * t;
    const widthAtT = Math.sin(t * 3.1416) * w;
    const ruffle = Math.sin(t * 6 + (petal.rufflePhase || 0) + 1) * w * 0.12;
    ctx.lineTo(bx - perpX * (widthAtT + ruffle), by - perpY * (widthAtT + ruffle));
  }
  ctx.closePath();

  // Fill - use pre-computed color for rotting, gradient for healthy
  if (petal.fillColor) {
    ctx.fillStyle = petal.fillColor;
  } else {
    const grad = ctx.createLinearGradient(0, 0, tipX, tipY);
    if (isStd) {
      grad.addColorStop(0, '#4a148c');
      grad.addColorStop(0.3, '#7b1fa2');
      grad.addColorStop(0.6, '#9c27b0');
      grad.addColorStop(1, '#ba68c8');
    } else {
      grad.addColorStop(0, '#311b92');
      grad.addColorStop(0.3, '#5c6bc0');
      grad.addColorStop(0.5, '#7986cb');
      grad.addColorStop(1, '#9fa8da');
    }
    ctx.fillStyle = grad;
  }
  ctx.fill();

  // Center vein
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(tipX, tipY);
  ctx.strokeStyle = petal.rotting ? 'rgba(60,40,20,0.2)' : 'rgba(100,50,150,0.25)';
  ctx.lineWidth = 1.5 * scale;
  ctx.stroke();

  // Side veins - batch into one path
  const veinStyle = petal.rotting ? 'rgba(60,40,20,0.15)' : 'rgba(100,50,150,0.15)';
  ctx.beginPath();
  for (let i = 1; i <= 3; i++) {
    const t = i * 0.25;
    const bx = tipX * t, by = tipY * t;
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + perpX * w * 0.5, by + perpY * w * 0.5);
    ctx.moveTo(bx, by);
    ctx.lineTo(bx - perpX * w * 0.5, by - perpY * w * 0.5);
  }
  ctx.strokeStyle = veinStyle;
  ctx.lineWidth = 0.8 * scale;
  ctx.stroke();

  // Beard for falls
  if (!isStd) {
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const t = 0.1 + (i / 10) * 0.5;
      const bx = tipX * t, by = tipY * t;
      const fuzz = Math.sin(i * 2 + (petal.beardPhase || 0)) * 2 * scale;
      if (i === 0) ctx.moveTo(bx + fuzz, by);
      else ctx.lineTo(bx + fuzz, by);
    }
    ctx.strokeStyle = petal.rotting ? '#8d6e3d' : '#FFD54F';
    ctx.lineWidth = 3 * scale;
    ctx.stroke();
  }

  // Pre-baked rotting spots
  if (petal.spots) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#3e2723';
    for (let i = 0; i < petal.spots.length; i++) {
      const s = petal.spots[i];
      ctx.beginPath();
      ctx.arc(tipX * s.t + s.offX * w, tipY * s.t + s.offY * w, s.r * scale, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Tear effect
  if (petal.removing && petal.tearProgress > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, 6 * scale, 0, 6.2832);
    ctx.fillStyle = `rgba(100,200,50,${petal.tearProgress * 0.5})`;
    ctx.fill();
    ctx.globalAlpha = petal.tearProgress * 0.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(
      (mousePos.x - petal.x) * petal.tearProgress * 0.15,
      (mousePos.y - petal.y) * petal.tearProgress * 0.15
    );
    ctx.strokeStyle = '#4a8c2a';
    ctx.lineWidth = 4 * scale * (1 - petal.tearProgress);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawFallingParts() {
  for (let i = 0; i < fallingCount; i++) {
    const f = fallingParts[i];
    ctx.globalAlpha = f.alpha;
    ctx.save();
    ctx.translate(f.x + f.vx * 10, f.y + f.vy * 5);
    ctx.rotate(f.rotation);
    const w = f.width || 15 * scale;
    const l = f.len || 30 * scale;
    ctx.beginPath();
    ctx.ellipse(0, 0, l * 0.4, w * 0.3, f.rotation, 0, 6.2832);
    ctx.fillStyle = f.partType === 'petal'
      ? (f.rotting ? '#5d4037' : '#7b1fa2')
      : (f.dying ? '#654321' : '#3d8822');
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  // Batch by type to minimize state changes
  // Type 0 = chlorophyll, type 1 = drip
  for (let i = 0; i < particleCount; i++) {
    const p = particles[i];
    ctx.globalAlpha = p.life;
    if (p.type === 1) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, 6.2832);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawSliceTrail() {
  if (trailLen < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 1; i < trailLen; i++) {
    const t = i / trailLen;
    const a = trailGet(i - 1), b = trailGet(i);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(220,220,240,${t * 0.7})`;
    ctx.lineWidth = (1 + t * 3) * scale;
    ctx.stroke();
  }
  if (slicing && trailLen > 0) {
    const tip = trailGet(trailLen - 1);
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 4 * scale, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fill();
  }
  ctx.restore();
}

function drawToolCursor() {
  ctx.globalAlpha = 0.4;
  if (tool === 'pluck') {
    ctx.beginPath();
    ctx.arc(mousePos.x, mousePos.y, 12 * scale, 0, 6.2832);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(mousePos.x - 8 * scale, mousePos.y - 8 * scale);
    ctx.lineTo(mousePos.x + 8 * scale, mousePos.y + 8 * scale);
    ctx.moveTo(mousePos.x + 8 * scale, mousePos.y - 8 * scale);
    ctx.lineTo(mousePos.x - 8 * scale, mousePos.y + 8 * scale);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ── Update ──
function update(dt) {
  windTimer -= dt;
  if (windTimer <= 0) {
    windTarget = (Math.random() - 0.5) * 0.8;
    windTimer = 2 + Math.random() * 4;
  }
  wind += (windTarget - wind) * 0.02;

  flower.swayPhase += dt * 1.5;

  // Update sway with fixed per-item speed (no per-frame random)
  const leaves = flower.leaves;
  for (let i = 0; i < leaves.length; i++) {
    leaves[i].sway += dt * leaves[i].swaySpeed;
  }
  const allPetals = flower.petals;
  for (let i = 0; i < allPetals.length; i++) {
    allPetals[i].sway += dt * allPetals[i].swaySpeed;
  }

  // Update particles (swap-and-pop)
  for (let i = particleCount - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0 || p.y > H + 20) {
      particleCount--;
      if (i < particleCount) {
        // Swap with last
        const tmp = particles[i];
        particles[i] = particles[particleCount];
        particles[particleCount] = tmp;
      }
    }
  }

  // Update falling parts (swap-and-pop)
  for (let i = fallingCount - 1; i >= 0; i--) {
    const f = fallingParts[i];
    f.x += f.vx;
    f.y += f.vy;
    f.vy += f.gravity;
    f.rotation += f.rotSpeed;
    f.alpha -= 0.003;
    if (f.alpha <= 0 || f.y > H + 50) {
      fallingCount--;
      if (i < fallingCount) {
        const tmp = fallingParts[i];
        fallingParts[i] = fallingParts[fallingCount];
        fallingParts[fallingCount] = tmp;
      }
    }
  }

  // Drip from cut
  if (flower.stemCut && Math.random() < 0.05) {
    const seg = flower.stemSegments[flower.stemCutSegIndex];
    spawnDroplets(seg.x, flower.stemCutY, 1);
  }
}

// ── Main Loop ──
let lastTime = 0;

function gameLoop(time) {
  const dt = Math.min((time - lastTime) * 0.001, 0.05);
  lastTime = time;

  update(dt);

  // Background (cached)
  if (bgDirty) rebuildBackground();
  ctx.drawImage(bgCanvas, 0, 0);

  drawStem();

  const leaves = flower.leaves;
  for (let i = 0; i < leaves.length; i++) drawLeaf(leaves[i]);

  const falls = flower.falls;
  for (let i = 0; i < falls.length; i++) drawPetal(falls[i]);
  const standards = flower.standards;
  for (let i = 0; i < standards.length; i++) drawPetal(standards[i]);

  drawFallingParts();
  drawParticles();
  drawSliceTrail();
  drawToolCursor();

  requestAnimationFrame(gameLoop);
}

// ── Start ──
init();
requestAnimationFrame(gameLoop);
</script>
