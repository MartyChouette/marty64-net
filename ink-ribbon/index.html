function renderCharacters() {
  const tab = document.getElementById('tab-characters');
  if (selectedChar >= data.characters.length) selectedChar = 0;
  const ch = data.characters[selectedChar];

  // Group by household
  const epaule = data.characters.filter(c => c.household === 'epaule');
  const aguien = data.characters.filter(c => c.household === 'aguien');
  const neutral = data.characters.filter(c => c.household !== 'epaule' && c.household !== 'aguien');

  let L = `<button class="mobile-toggle" onclick="toggleSidebar(this)">Households</button><div class="side-list">`;
  L += `<h3>Households <button onclick="addCharacter()">+ New</button></h3>`;
  L += `<div class="list-items">`;

  function renderGroup(label, chars, color) {
    L += `<div class="collapsible-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')"><span style="color:${color}">${esc(label)} (${chars.length})</span><span class="chevron">&#9660;</span></div>`;
    L += `<div class="collapsible-body">`;
    chars.forEach(c => {
      const gi = data.characters.indexOf(c);
      L += `<div class="list-item${gi === selectedChar ? ' active' : ''}" onclick="selectedChar=${gi};renderCharacters()">`;
      L += `<div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0"><span class="char-color-dot" style="background:${c.color}"></span><div><div class="li-name">${esc(c.name)}</div><div class="li-sub">${esc(c.role)}</div></div></div>`;
      L += `<div class="reorder-btns" onclick="event.stopPropagation()"><button class="reorder-btn" onclick="reorder(data.characters,${gi},-1);selectedChar=Math.max(0,selectedChar-1);renderCharacters()">&uarr;</button><button class="reorder-btn" onclick="reorder(data.characters,${gi},1);if(selectedChar===${gi})selectedChar++;renderCharacters()">&darr;</button></div>`;
      L += `</div>`;
    });
    L += `</div>`;
  }

  renderGroup('Epaule Household', epaule, 'var(--serennan)');
  renderGroup('Aguien Household', aguien, 'var(--aurinian)');
  if (neutral.length) renderGroup('Neutral', neutral, 'var(--text2)');

  L += `</div></div>`;

  let E = `<div class="editor-panel">`;
  if (ch) {
    E += `<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px"><div style="width:48px;height:48px;border-radius:50%;border:2px solid ${ch.color};background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;color:${ch.color}">${esc(ch.name[0])}</div><div><h2>${esc(ch.name)}</h2><div class="ep-sub">${esc(ch.role)}</div></div></div>`;

    E += `<div class="form-row"><div class="form-group"><label>Name</label><input type="text" value="${esc(ch.name)}" onchange="data.characters[${selectedChar}].name=this.value;saveData();renderCharacters()"></div><div class="form-group"><label>Color</label><input type="color" value="${esc(ch.color)}" onchange="data.characters[${selectedChar}].color=this.value;saveData();renderCharacters()"></div></div>`;

    E += `<div class="form-row"><div class="form-group"><label>Household</label><select onchange="data.characters[${selectedChar}].household=this.value;saveData();renderCharacters()"><option value="epaule"${ch.household==='epaule'?' selected':''}>Epaule</option><option value="aguien"${ch.household==='aguien'?' selected':''}>Aguien</option><option value="neutral"${ch.household==='neutral'?' selected':''}>Neutral</option></select></div><div class="form-group"><label>Role</label><input type="text" value="${esc(ch.role)}" onchange="data.characters[${selectedChar}].role=this.value;saveData()"></div></div>`;

    // Political alignment slider
    E += `<div class="form-group"><label>Political Alignment (${ch.alignment > 0 ? '+' : ''}${ch.alignment})</label>`;
    const pct = ((ch.alignment + 5) / 10) * 100;
    E += `<div class="alignment-bar" onclick="const r=this.getBoundingClientRect();const x=(event.clientX-r.left)/r.width;const v=Math.round(x*10-5);data.characters[${selectedChar}].alignment=Math.max(-5,Math.min(5,v));saveData();renderCharacters()"><div class="alignment-marker" style="left:${pct}%"></div></div>`;
    E += `<div class="alignment-labels"><span>-5 Serennan</span><span>0 Neutral</span><span>+5 Aurinian</span></div>`;
    E += `</div>`;

    E += `<div class="form-group"><label>Personality</label><textarea onchange="data.characters[${selectedChar}].personality=this.value;saveData()">${esc(ch.personality)}</textarea></div>`;

    // Arc textareas
    E += `<div class="detail-section"><h4>Character Arc</h4>`;
    E += `<div class="form-group"><label>Act 1</label><textarea style="min-height:60px" onchange="data.characters[${selectedChar}].arc.act1=this.value;saveData()">${esc(ch.arc?.act1||'')}</textarea></div>`;
    E += `<div class="form-group"><label>Act 2</label><textarea style="min-height:60px" onchange="data.characters[${selectedChar}].arc.act2=this.value;saveData()">${esc(ch.arc?.act2||'')}</textarea></div>`;
    E += `<div class="form-group"><label>Act 3</label><textarea style="min-height:60px" onchange="data.characters[${selectedChar}].arc.act3=this.value;saveData()">${esc(ch.arc?.act3||'')}</textarea></div>`;
    E += `</div>`;

    E += `<div class="form-group"><label>Player Influence</label><textarea onchange="data.characters[${selectedChar}].playerInfluence=this.value;saveData()">${esc(ch.playerInfluence||'')}</textarea></div>`;

    // Relationships
    E += `<div class="detail-section"><h4>Relationships <button class="btn" style="font-size:10px;padding:2px 8px;margin-left:8px" onclick="data.characters[${selectedChar}].relationships.push({targetId:'',description:''});saveData();renderCharacters()">+ Add</button></h4>`;
    (ch.relationships || []).forEach((rel, ri) => {
      const target = data.characters.find(c => c.id === rel.targetId);
      E += `<div class="card" style="border-left:3px solid ${target ? target.color : 'var(--border)'}">`;
      E += `<div class="card-head"><select style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px;border-radius:3px;font-size:11px" onchange="data.characters[${selectedChar}].relationships[${ri}].targetId=this.value;saveData();renderCharacters()"><option value="">Select...</option>${data.characters.filter(c=>c.id!==ch.id).map(c=>`<option value="${c.id}"${rel.targetId===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn btn-danger" style="font-size:10px;padding:1px 6px" onclick="data.characters[${selectedChar}].relationships.splice(${ri},1);saveData();renderCharacters()">&times;</button></div>`;
      E += `<textarea style="min-height:40px" onchange="data.characters[${selectedChar}].relationships[${ri}].description=this.value;saveData()">${esc(rel.description)}</textarea>`;
      E += `</div>`;
    });
    E += `</div>`;

    E += `<div class="form-group"><label>Notes</label><textarea onchange="data.characters[${selectedChar}].notes=this.value;saveData()">${esc(ch.notes||'')}</textarea></div>`;

    // Cross-references: documents where this character is dictator or addressee
    const dictatedDocs = data.documents.filter(d => d.dictatedBy === ch.id);
    const addressedDocs = data.documents.filter(d => d.addressedTo === ch.id);
    if (dictatedDocs.length || addressedDocs.length) {
      E += `<div class="detail-section" style="margin-top:16px"><h4>Referenced Documents</h4>`;
      dictatedDocs.forEach(d => {
        const di = data.documents.indexOf(d);
        E += `<div class="card" style="cursor:pointer;border-left:3px solid var(--doc-dictation)" onclick="selectedDoc=${di};switchTab('documents')"><div class="card-head">${esc(d.title)} <span style="font-size:10px;color:var(--text2)">dictates</span></div><div class="card-body">Day ${d.day}</div></div>`;
      });
      addressedDocs.forEach(d => {
        const di = data.documents.indexOf(d);
        E += `<div class="card" style="cursor:pointer;border-left:3px solid var(--doc-incoming)" onclick="selectedDoc=${di};switchTab('documents')"><div class="card-head">${esc(d.title)} <span style="font-size:10px;color:var(--text2)">addressed to</span></div><div class="card-body">Day ${d.day}</div></div>`;
      });
      E += `</div>`;
    }

    E += `<div class="btn-row"><button class="btn btn-danger" onclick="if(confirm('Delete this character?')){data.characters.splice(${selectedChar},1);selectedChar=0;saveData();renderCharacters()}">Delete</button></div>`;
  } else {
    E += `<div class="empty-state">No character selected</div>`;
  }
  E += `</div>`;
  tab.innerHTML = L + E;
}

function addCharacter() {
  data.characters.push({ id:genId(), name:'New Character', color:'#8a7e6e', household:'neutral', role:'', alignment:0, personality:'', arc:{act1:'',act2:'',act3:''}, playerInfluence:'', relationships:[], notes:'' });
  selectedChar = data.characters.length - 1;
  saveData();
  renderCharacters();
}

// =====================================================
// RENDER: DOCUMENTS
// =====================================================
function renderDocuments() {
  const tab = document.getElementById('tab-documents');
  if (selectedDoc >= data.documents.length) selectedDoc = 0;
  const doc = data.documents[selectedDoc];

  let L = `<button class="mobile-toggle" onclick="toggleSidebar(this)">Documents</button><div class="side-list">`;
  L += `<h3>Documents <button onclick="addDocument()">+ New</button></h3>`;
  L += `<div class="list-items">`;

  data.documents.forEach((d, i) => {
    const typeColors = { official_dictation:'var(--doc-dictation)', copywork:'var(--doc-copywork)', incoming_aguien:'var(--doc-incoming)', outgoing_aguien:'var(--doc-outgoing)', helvetan_trade:'var(--doc-trade)', personal_letter:'var(--doc-personal)' };
    const bc = typeColors[d.type] || 'var(--border)';
    const hasHidden = d.hiddenLayer && d.hiddenLayer.encoded && d.hiddenLayer.encoded.trim();
    L += `<div class="list-item${i === selectedDoc ? ' active' : ''}" style="border-left:3px solid ${bc}" onclick="selectedDoc=${i};renderDocuments()">`;
    L += `<div style="flex:1;min-width:0"><div class="li-name">${esc(d.title)}${hasHidden ? '<span class="hidden-icon" title="Has hidden layer">&#9674;</span>' : ''}</div>`;
    L += `<div class="li-sub">Day ${d.day} ${getSupervisionBadge(d.supervision)}</div>`;
    L += `</div></div>`;
  });

  L += `</div></div>`;

  let E = `<div class="editor-panel">`;
  if (doc) {
    E += `<h2>${esc(doc.title)}</h2>`;
    E += `<div class="ep-sub">${getDocTypeBadge(doc.type)} ${getSupervisionBadge(doc.supervision)} ${getPacingBadge(doc.pacing)}</div>`;

    E += `<div class="form-group"><label>Title</label><input type="text" value="${esc(doc.title)}" onchange="data.documents[${selectedDoc}].title=this.value;saveData();renderDocuments()"></div>`;

    E += `<div class="form-row"><div class="form-group"><label>Type</label><select onchange="data.documents[${selectedDoc}].type=this.value;saveData();renderDocuments()"><option value="official_dictation"${doc.type==='official_dictation'?' selected':''}>Official Dictation</option><option value="copywork"${doc.type==='copywork'?' selected':''}>Copywork</option><option value="incoming_aguien"${doc.type==='incoming_aguien'?' selected':''}>Incoming (Aguien)</option><option value="outgoing_aguien"${doc.type==='outgoing_aguien'?' selected':''}>Outgoing (Aguien)</option><option value="helvetan_trade"${doc.type==='helvetan_trade'?' selected':''}>Helvetan Trade</option><option value="personal_letter"${doc.type==='personal_letter'?' selected':''}>Personal Letter</option></select></div>`;
    E += `<div class="form-group"><label>Supervision</label><select onchange="data.documents[${selectedDoc}].supervision=this.value;saveData();renderDocuments()" style="color:var(--supervision-${doc.supervision||'unattended'})"><option value="close"${doc.supervision==='close'?' selected':''} style="color:var(--supervision-close)">Close</option><option value="checked"${doc.supervision==='checked'?' selected':''} style="color:var(--supervision-checked)">Checked</option><option value="glanced"${doc.supervision==='glanced'?' selected':''} style="color:var(--supervision-glanced)">Glanced</option><option value="unattended"${doc.supervision==='unattended'?' selected':''} style="color:var(--supervision-unattended)">Unattended</option></select></div></div>`;

    E += `<div class="form-row-3"><div class="form-group"><label>Act</label><select onchange="data.documents[${selectedDoc}].act=parseInt(this.value);saveData()"><option value="1"${doc.act===1?' selected':''}>Act 1</option><option value="2"${doc.act===2?' selected':''}>Act 2</option><option value="3"${doc.act===3?' selected':''}>Act 3</option></select></div>`;
    E += `<div class="form-group"><label>Day</label><input type="number" value="${doc.day||1}" min="1" max="80" onchange="data.documents[${selectedDoc}].day=parseInt(this.value)||1;saveData()"></div>`;
    E += `<div class="form-group"><label>Pacing</label><select onchange="data.documents[${selectedDoc}].pacing=this.value;saveData();renderDocuments()"><option value="quiet"${doc.pacing==='quiet'?' selected':''}>Quiet</option><option value="routine"${doc.pacing==='routine'?' selected':''}>Routine</option><option value="tense"${doc.pacing==='tense'?' selected':''}>Tense</option><option value="crisis"${doc.pacing==='crisis'?' selected':''}>Crisis</option><option value="climactic"${doc.pacing==='climactic'?' selected':''}>Climactic</option></select></div></div>`;

    E += `<div class="form-row"><div class="form-group"><label>Dictated By</label><select onchange="data.documents[${selectedDoc}].dictatedBy=this.value;saveData();renderDocuments()"><option value="">None</option>${data.characters.map(c=>`<option value="${c.id}"${doc.dictatedBy===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;
    E += `<div class="form-group"><label>Addressed To</label><select onchange="data.documents[${selectedDoc}].addressedTo=this.value;saveData()"><option value="">None / External</option>${data.characters.map(c=>`<option value="${c.id}"${doc.addressedTo===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>`;

    E += `<div class="form-group"><label>Surface Text</label><textarea class="mono" style="min-height:150px" onchange="data.documents[${selectedDoc}].surfaceText=this.value;saveData()">${esc(doc.surfaceText)}</textarea></div>`;

    // Hidden Layer (collapsible)
    const hl = doc.hiddenLayer || {};
    const hasHL = hl.encoded || (hl.ciphers && hl.ciphers.length);
    E += `<div style="background:var(--bg);border:1px solid var(--channel-candlelight);border-radius:8px;padding:14px;margin-bottom:16px">`;
    E += `<div class="collapsible-header" style="padding:0;background:none;border:none;margin-bottom:${hasHL?'12':'0'}px" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')"><span style="color:var(--channel-candlelight)">&#9674; Hidden Layer</span><span class="chevron">&#9660;</span></div>`;
    E += `<div class="collapsible-body">`;

    E += `<div class="form-group"><label>Ciphers Used</label><div class="tag-list">`;
    (hl.ciphers || []).forEach((cid, ci) => {
      const cipher = data.ciphers.find(c => c.id === cid);
      E += `<span class="tag removable" style="color:var(--channel-${cipher?.channel||'daylight'});border-color:var(--channel-${cipher?.channel||'daylight'})" onclick="data.documents[${selectedDoc}].hiddenLayer.ciphers.splice(${ci},1);saveData();renderDocuments()">${cipher ? esc(cipher.name) : esc(cid)} &times;</span>`;
    });
    E += `</div><select style="margin-top:6px;width:auto;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px;border-radius:3px;font-size:11px" onchange="if(this.value){if(!data.documents[${selectedDoc}].hiddenLayer.ciphers)data.documents[${selectedDoc}].hiddenLayer.ciphers=[];data.documents[${selectedDoc}].hiddenLayer.ciphers.push(this.value);saveData();renderDocuments()}"><option value="">+ Add cipher...</option>${data.ciphers.filter(c=>!(hl.ciphers||[]).includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>`;

    E += `<div class="form-group"><label>Encoded Content</label><textarea class="mono" style="min-height:80px" onchange="data.documents[${selectedDoc}].hiddenLayer.encoded=this.value;saveData()">${esc(hl.encoded||'')}</textarea></div>`;
    E += `<div class="form-group"><label>Method</label><textarea style="min-height:50px" onchange="data.documents[${selectedDoc}].hiddenLayer.method=this.value;saveData()">${esc(hl.method||'')}</textarea></div>`;
    E += `<div class="form-group"><label>Worked Example</label><textarea class="mono" style="min-height:80px" onchange="data.documents[${selectedDoc}].hiddenLayer.workedExample=this.value;saveData()">${esc(hl.workedExample||'')}</textarea></div>`;

    E += `</div></div>`;

    // Editorial choices
    E += `<div class="detail-section"><h4>Editorial Choices <button class="btn" style="font-size:10px;padding:2px 8px;margin-left:8px" onclick="data.documents[${selectedDoc}].editorialChoices.push({description:'',tugEffect:0,consequence:'',requiresCipher:''});saveData();renderDocuments()">+ Add</button></h4>`;
    (doc.editorialChoices || []).forEach((ec, ei) => {
      E += `<div class="card">`;
      E += `<div class="card-head"><span>Choice ${ei+1}</span><button class="btn btn-danger" style="font-size:10px;padding:1px 6px" onclick="data.documents[${selectedDoc}].editorialChoices.splice(${ei},1);saveData();renderDocuments()">&times;</button></div>`;
      E += `<div class="form-group" style="margin-bottom:6px"><label>Description</label><textarea style="min-height:40px" onchange="data.documents[${selectedDoc}].editorialChoices[${ei}].description=this.value;saveData()">${esc(ec.description)}</textarea></div>`;
      E += `<div class="form-row"><div class="form-group" style="margin-bottom:6px"><label>Tug Effect</label><input type="number" value="${ec.tugEffect||0}" step="0.5" onchange="data.documents[${selectedDoc}].editorialChoices[${ei}].tugEffect=parseFloat(this.value)||0;saveData()"></div>`;
      E += `<div class="form-group" style="margin-bottom:6px"><label>Requires Cipher</label><select onchange="data.documents[${selectedDoc}].editorialChoices[${ei}].requiresCipher=this.value;saveData()"><option value="">None</option>${data.ciphers.map(c=>`<option value="${c.id}"${ec.requiresCipher===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>`;
      E += `<div class="form-group" style="margin-bottom:0"><label>Consequence</label><textarea style="min-height:40px" onchange="data.documents[${selectedDoc}].editorialChoices[${ei}].consequence=this.value;saveData()">${esc(ec.consequence)}</textarea></div>`;
      E += `</div>`;
    });
    E += `</div>`;

    E += `<div class="form-group"><label>Notes</label><textarea onchange="data.documents[${selectedDoc}].notes=this.value;saveData()">${esc(doc.notes||'')}</textarea></div>`;

    E += `<div class="btn-row"><button class="btn btn-danger" onclick="if(confirm('Delete this document?')){data.documents.splice(${selectedDoc},1);selectedDoc=0;saveData();renderDocuments()}">Delete</button></div>`;
  } else {
    E += `<div class="empty-state">No document selected</div>`;
  }
  E += `</div>`;
  tab.innerHTML = L + E;
}

function addDocument() {
  data.documents.push({ id:genId(), title:'New Document', type:'official_dictation', day:1, act:1, supervision:'unattended', dictatedBy:'', addressedTo:'', surfaceText:'', hiddenLayer:{ ciphers:[], encoded:'', method:'', workedExample:'' }, editorialChoices:[], pacing:'routine', notes:'' });
  selectedDoc = data.documents.length - 1;
  saveData();
  renderDocuments();
}

// =====================================================
// RENDER: CIPHERS
// =====================================================
function renderCiphers() {
  const tab = document.getElementById('tab-ciphers');
  if (selectedCipher >= data.ciphers.length) selectedCipher = 0;
  const cipher = data.ciphers[selectedCipher];

  const daylight = data.ciphers.filter(c => c.channel === 'daylight');
  const candlelight = data.ciphers.filter(c => c.channel === 'candlelight');
  const physical = data.ciphers.filter(c => c.channel === 'physical');

  let L = `<button class="mobile-toggle" onclick="toggleSidebar(this)">Ciphers</button><div class="side-list">`;
  L += `<h3>Ciphers <button onclick="addCipher()">+ New</button></h3>`;
  L += `<div class="list-items">`;

  function renderCipherGroup(label, ciphers, color) {
    L += `<div class="collapsible-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')"><span style="color:${color}">${esc(label)} (${ciphers.length})</span><span class="chevron">&#9660;</span></div>`;
    L += `<div class="collapsible-body">`;
    ciphers.forEach(c => {
      const gi = data.ciphers.indexOf(c);
      L += `<div class="list-item${gi === selectedCipher ? ' active' : ''}" onclick="selectedCipher=${gi};renderCiphers()">`;
      L += `<div style="flex:1;min-width:0"><div class="li-name">${esc(c.name)}</div>`;
      L += `<div class="li-sub"><span class="complexity-dots">${[1,2,3].map(n=>`<span class="complexity-dot${n<=c.complexity?' filled':''}"></span>`).join('')}</span> Day ${c.discoveryDay}</div>`;
      L += `</div></div>`;
    });
    L += `</div>`;
  }

  renderCipherGroup('Daylight', daylight, 'var(--channel-daylight)');
  renderCipherGroup('Candlelight', candlelight, 'var(--channel-candlelight)');
  renderCipherGroup('Physical', physical, 'var(--channel-physical)');

  L += `</div></div>`;

  let E = `<div class="editor-panel">`;
  if (cipher) {
    E += `<h2>${esc(cipher.name)}</h2>`;
    E += `<div class="ep-sub">${getChannelBadge(cipher.channel)} Complexity ${cipher.complexity}</div>`;

    E += `<div class="form-group"><label>Name</label><input type="text" value="${esc(cipher.name)}" onchange="data.ciphers[${selectedCipher}].name=this.value;saveData();renderCiphers()"></div>`;

    E += `<div class="form-row-3"><div class="form-group"><label>Channel</label><select onchange="data.ciphers[${selectedCipher}].channel=this.value;saveData();renderCiphers()"><option value="daylight"${cipher.channel==='daylight'?' selected':''}>Daylight</option><option value="candlelight"${cipher.channel==='candlelight'?' selected':''}>Candlelight</option><option value="physical"${cipher.channel==='physical'?' selected':''}>Physical</option></select></div>`;
    E += `<div class="form-group"><label>Category</label><input type="text" value="${esc(cipher.category||'')}" onchange="data.ciphers[${selectedCipher}].category=this.value;saveData()"></div>`;
    E += `<div class="form-group"><label>Complexity</label><div style="display:flex;gap:6px;margin-top:4px">${[1,2,3].map(n=>`<div style="width:24px;height:24px;border-radius:50%;border:2px solid ${n<=cipher.complexity?'var(--accent3)':'var(--border)'};background:${n<=cipher.complexity?'var(--accent3)':'var(--bg)'};cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:${n<=cipher.complexity?'#000':'var(--text2)'}" onclick="data.ciphers[${selectedCipher}].complexity=${n};saveData();renderCiphers()">${n}</div>`).join('')}</div></div></div>`;

    E += `<div class="form-row"><div class="form-group"><label>Discovery Day</label><input type="number" value="${cipher.discoveryDay||1}" min="1" max="80" onchange="data.ciphers[${selectedCipher}].discoveryDay=parseInt(this.value)||1;saveData()"></div><div class="form-group"><label>ID</label><input type="text" value="${esc(cipher.id)}" disabled style="opacity:0.5"></div></div>`;

    E += `<div class="form-group"><label>Discovery Method</label><textarea onchange="data.ciphers[${selectedCipher}].discoveryMethod=this.value;saveData()">${esc(cipher.discoveryMethod||'')}</textarea></div>`;

    E += `<div class="form-group"><label>Description</label><textarea onchange="data.ciphers[${selectedCipher}].description=this.value;saveData()">${esc(cipher.description||'')}</textarea></div>`;

    E += `<div class="form-group"><label>Worked Example</label><textarea class="mono" style="min-height:120px" onchange="data.ciphers[${selectedCipher}].workedExample=this.value;saveData()">${esc(cipher.workedExample||'')}</textarea></div>`;

    // Dependencies
    E += `<div class="form-group"><label>Dependencies</label><div class="tag-list">`;
    (cipher.dependencies || []).forEach((dep, di) => {
      const dc = data.ciphers.find(c => c.id === dep);
      E += `<span class="tag removable" onclick="data.ciphers[${selectedCipher}].dependencies.splice(${di},1);saveData();renderCiphers()">${dc ? esc(dc.name) : esc(dep)} &times;</span>`;
    });

    E += `<div class="form-group"><label>Notes</label><textarea onchange="data.ciphers[${selectedCipher}].notes=this.value;saveData()">${esc(cipher.notes||'')}</textarea></div>`;

function addCipher() {

// =====================================================
// RENDER: DAY PLANNER
// =====================================================
function renderDays() {
  const tab = document.getElementById('tab-days');
  let html = '';

  html += `<h2 style="margin-bottom:4px">Day Planner</h2>`;
  html += `<p style="color:var(--text2);font-size:12px;margin-bottom:20px">80 days, three acts. Each row shows documents, newly available ciphers, and tug-of-war state for that day.</p>`;

  let lastAct = 0;
  const sortedDays = [...data.days].sort((a, b) => a.dayNumber - b.dayNumber);

  sortedDays.forEach((day, di) => {
    const realIdx = data.days.indexOf(day);

    // Act headers
    if (day.act !== lastAct) {
      html += `<div class="act-header">Act ${day.act}</div>`;
      lastAct = day.act;
    }

    const docs = data.documents.filter(d => d.day === day.dayNumber);
    const newCiphers = data.ciphers.filter(c => c.discoveryDay === day.dayNumber);
    const tugVal = computeTugAtDay(day.dayNumber);

    html += `<div class="day-row">`;
    html += `<div class="day-label"><div class="day-num">${day.dayNumber}</div><select style="font-size:9px;padding:1px 2px;background:transparent;border:1px solid var(--border);color:var(--${day.pacing ? 'pacing-'+day.pacing : 'text2'});border-radius:2px;width:54px" onchange="data.days[${realIdx}].pacing=this.value;saveData();renderDays()">${['quiet','routine','tense','crisis','climactic'].map(p=>`<option value="${p}"${day.pacing===p?' selected':''}>${p}</option>`).join('')}</select></div>`;
    html += `<div class="day-content">`;

    // Pacing bar
    html += `<div class="day-pacing-bar ${day.pacing||'routine'}" style="width:100%"></div>`;

    // Documents row
    if (docs.length) {
      html += `<div class="day-row-group"><span class="day-row-label">Docs</span>`;
      docs.forEach(d => {
        const typeColors = { official_dictation:'var(--doc-dictation)', copywork:'var(--doc-copywork)', incoming_aguien:'var(--doc-incoming)', outgoing_aguien:'var(--doc-outgoing)', helvetan_trade:'var(--doc-trade)', personal_letter:'var(--doc-personal)' };
        const c = typeColors[d.type] || 'var(--border)';
        const dIdx = data.documents.indexOf(d);
        html += `<div class="day-chip" style="border-color:${c};color:${c}" onclick="selectedDoc=${dIdx};switchTab('documents')" title="${esc(d.title)}">${esc(d.title.length > 25 ? d.title.substring(0,25)+'...' : d.title)}</div>`;
      });
      html += `</div>`;
    }

    // New ciphers
    if (newCiphers.length) {
      html += `<div class="day-row-group"><span class="day-row-label">Ciphers</span>`;
      newCiphers.forEach(c => {
        const ci = data.ciphers.indexOf(c);
        html += `<div class="day-chip" style="border-color:var(--channel-${c.channel});color:var(--channel-${c.channel})" onclick="selectedCipher=${ci};switchTab('ciphers')">${esc(c.name)}</div>`;
      });
      html += `</div>`;
    }

    // Tug value mini bar
    const tugPct = Math.max(0, Math.min(100, (tugVal + 50) / 100 * 100));
    const tugColor = tugVal > 5 ? 'var(--tug-war)' : tugVal < -5 ? 'var(--tug-peace)' : 'var(--tug-neutral)';
    html += `<div class="day-row-group"><span class="day-row-label">Tug</span>`;
    html += `<div class="tug-mini-bar"><div class="tug-mini-fill" style="left:${Math.min(50,tugPct)}%;width:${Math.abs(tugPct-50)}%;background:${tugColor}"></div></div>`;
    html += `<span style="font-size:10px;color:${tugColor}">${tugVal > 0 ? '+' : ''}${tugVal.toFixed(1)}</span>`;
    html += `</div>`;

    // Events/notes
    if (day.events) {
      html += `<div style="font-size:11px;color:var(--text2);margin-top:2px"><textarea style="width:100%;background:transparent;border:1px solid transparent;color:var(--text2);padding:2px 4px;font-size:11px;font-family:inherit;min-height:24px;resize:vertical;border-radius:3px" onfocus="this.style.borderColor='var(--border)'" onblur="this.style.borderColor='transparent'" onchange="data.days[${realIdx}].events=this.value;saveData()">${esc(day.events)}</textarea></div>`;
    }

    // Composition rule validation
    const dayIssues = [];
    if (docs.length === 0) dayIssues.push('No documents');
    docs.forEach(d => {
      if (d.hiddenLayer && d.hiddenLayer.ciphers && d.hiddenLayer.ciphers.length) {
        d.hiddenLayer.ciphers.forEach(cid => {
          const cipher = data.ciphers.find(c => c.id === cid);
          if (cipher && cipher.discoveryDay > day.dayNumber) dayIssues.push(`Cipher "${cipher.name}" not yet discovered`);
        });
      }
    });
    if (dayIssues.length) {
      html += `<div style="font-size:10px;margin-top:2px">${dayIssues.map(i=>`<span style="color:var(--red)">&#10007; ${esc(i)}</span>`).join(' ')}</div>`;
    } else if (docs.length) {
      html += `<div style="font-size:10px;margin-top:2px"><span style="color:var(--green)">&#10003; Valid</span></div>`;
    }

    html += `</div></div>`;
  });

  html += `<div class="btn-row" style="margin-top:16px"><button class="btn btn-accent" onclick="addDay()">+ Add Day</button></div>`;

  tab.innerHTML = html;
}

function addDay() {
  const maxDay = data.days.reduce((m, d) => Math.max(m, d.dayNumber), 0);
  const newDay = maxDay + 1;
  const act = newDay <= 30 ? 1 : newDay <= 60 ? 2 : 3;
  data.days.push({ dayNumber: newDay, act: act, pacing: 'routine', events: '', notes: '' });
  saveData();
  renderDays();
}

// =====================================================
// RENDER: TUG OF WAR
// =====================================================
function renderTugOfWar() {
  const tab = document.getElementById('tab-tugofwar');
  if (selectedForce >= data.forces.length) selectedForce = 0;
  const force = data.forces[selectedForce];

  const peaceForces = data.forces.filter(f => f.direction === 'peace');
  const warForces = data.forces.filter(f => f.direction === 'war');

  let L = `<button class="mobile-toggle" onclick="toggleSidebar(this)">Forces</button><div class="side-list">`;
  L += `<h3>Forces <button onclick="addForce()">+ New</button></h3>`;
  L += `<div class="list-items">`;

  L += `<div class="collapsible-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')"><span style="color:var(--tug-peace)">Toward Peace (${peaceForces.length})</span><span class="chevron">&#9660;</span></div>`;
  L += `<div class="collapsible-body">`;
  peaceForces.forEach(f => {
    const gi = data.forces.indexOf(f);
    L += `<div class="list-item${gi === selectedForce ? ' active' : ''}" onclick="selectedForce=${gi};renderTugOfWar()"><div style="flex:1;min-width:0"><div class="li-name">${esc(f.name)}</div><div class="li-sub"><span class="badge badge-routine">${esc(f.source)}</span> mag ${f.magnitude}</div></div></div>`;
  });
  L += `</div>`;

  L += `<div class="collapsible-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed')"><span style="color:var(--tug-war)">Toward War (${warForces.length})</span><span class="chevron">&#9660;</span></div>`;
  L += `<div class="collapsible-body">`;
  warForces.forEach(f => {
    const gi = data.forces.indexOf(f);
    L += `<div class="list-item${gi === selectedForce ? ' active' : ''}" onclick="selectedForce=${gi};renderTugOfWar()"><div style="flex:1;min-width:0"><div class="li-name">${esc(f.name)}</div><div class="li-sub"><span class="badge badge-crisis">${esc(f.source)}</span> mag ${f.magnitude}</div></div></div>`;
  });
  L += `</div>`;

  L += `</div></div>`;

  let E = `<div class="editor-panel">`;
  if (force) {
    E += `<h2>${esc(force.name)}</h2>`;
    E += `<div class="ep-sub">${force.direction === 'peace' ? '<span style="color:var(--tug-peace)">Toward Peace</span>' : '<span style="color:var(--tug-war)">Toward War</span>'} - ${esc(force.source)}</div>`;

    E += `<div class="form-group"><label>Name</label><input type="text" value="${esc(force.name)}" onchange="data.forces[${selectedForce}].name=this.value;saveData();renderTugOfWar()"></div>`;

    E += `<div class="form-row-3"><div class="form-group"><label>Direction</label><select onchange="data.forces[${selectedForce}].direction=this.value;saveData();renderTugOfWar()"><option value="peace"${force.direction==='peace'?' selected':''}>Peace</option><option value="war"${force.direction==='war'?' selected':''}>War</option></select></div>`;
    E += `<div class="form-group"><label>Source</label><select onchange="data.forces[${selectedForce}].source=this.value;saveData()"><option value="constant"${force.source==='constant'?' selected':''}>Constant</option><option value="document"${force.source==='document'?' selected':''}>Document</option><option value="cipher"${force.source==='cipher'?' selected':''}>Cipher</option><option value="backchannel"${force.source==='backchannel'?' selected':''}>Backchannel</option><option value="event"${force.source==='event'?' selected':''}>Event</option></select></div>`;
    E += `<div class="form-group"><label>Magnitude</label><input type="number" value="${force.magnitude||0}" step="0.5" min="0" onchange="data.forces[${selectedForce}].magnitude=parseFloat(this.value)||0;saveData()"></div></div>`;

    E += `<div class="form-row"><div class="form-group"><label>Start Day</label><input type="number" value="${force.startDay||1}" min="1" onchange="data.forces[${selectedForce}].startDay=parseInt(this.value)||1;saveData()"></div>`;
    E += `<div class="form-group"><label>End Day</label><input type="number" value="${force.endDay||999}" min="1" onchange="data.forces[${selectedForce}].endDay=parseInt(this.value)||999;saveData()"></div></div>`;

    E += `<div class="form-group"><label>Description</label><textarea onchange="data.forces[${selectedForce}].description=this.value;saveData()">${esc(force.description||'')}</textarea></div>`;
    E += `<div class="form-group"><label>Notes</label><textarea onchange="data.forces[${selectedForce}].notes=this.value;saveData()">${esc(force.notes||'')}</textarea></div>`;

    E += `<div class="btn-row"><button class="btn btn-danger" onclick="if(confirm('Delete this force?')){data.forces.splice(${selectedForce},1);selectedForce=0;saveData();renderTugOfWar()}">Delete</button></div>`;
  } else {
    E += `<div class="empty-state">No force selected</div>`;
  }

  // Simulation chart
  E += `<div class="detail-section" style="margin-top:24px"><h4>Tug-of-War Simulation</h4>`;
  E += `<p style="font-size:11px;color:var(--text2);margin-bottom:8px">Cumulative tug value across all planned days. Green = peace zone, yellow = neutral, red = war zone.</p>`;

  const sortedDays = [...data.days].sort((a, b) => a.dayNumber - b.dayNumber);
  const tugValues = sortedDays.map(d => ({ day: d.dayNumber, val: computeTugAtDay(d.dayNumber) }));
  const maxAbsTug = Math.max(10, ...tugValues.map(t => Math.abs(t.val)));

  E += `<div class="sim-chart">`;
  E += `<div class="sim-zone green" style="left:0;width:33%"></div>`;
  E += `<div class="sim-zone yellow" style="left:33%;width:34%"></div>`;
  E += `<div class="sim-zone red" style="left:67%;width:33%"></div>`;
  E += `<div class="sim-center"></div>`;

  if (tugValues.length) {
    const barWidth = Math.max(4, Math.min(12, Math.floor(100 / tugValues.length * 0.8)));
    tugValues.forEach((t, i) => {
      const x = (i / Math.max(1, tugValues.length - 1)) * 90 + 5;
      const normalizedVal = t.val / maxAbsTug;
      const heightPct = Math.abs(normalizedVal) * 45;
      const bottom = normalizedVal >= 0 ? 50 : 50 - heightPct;
      const color = t.val > 5 ? 'var(--tug-war)' : t.val < -5 ? 'var(--tug-peace)' : 'var(--tug-neutral)';
      E += `<div class="sim-bar" style="left:${x}%;bottom:${bottom}%;height:${heightPct}%;width:${barWidth}px;background:${color}" title="Day ${t.day}: ${t.val > 0 ? '+' : ''}${t.val.toFixed(1)}"></div>`;
    });
  }

  E += `</div>`;
  E += `<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-top:4px"><span>Peace</span><span>Neutral</span><span>War</span></div>`;
  E += `</div>`;

  E += `</div>`;
  tab.innerHTML = L + E;
}

function addForce() {
  data.forces.push({ id:genId(), name:'New Force', direction:'peace', source:'event', magnitude:1, startDay:1, endDay:999, description:'', notes:'' });
  selectedForce = data.forces.length - 1;
  saveData();
  renderTugOfWar();
}

// RENDER: STREET WINDOW

function renderWindow() {

  L += `<div class="list-items">`;

  data.indicators.forEach((indicator, i) => {
    const tsColors = { immediate:'var(--red)', daily:'var(--accent3)', weekly:'var(--blue)', act:'var(--text2)' };
    L += `<div class="list-item${i === selectedIndicator ? ' active' : ''}" onclick="selectedIndicator=${i};renderWindow()">`;
    L += `<div style="flex:1;min-width:0"><div class="li-name">${esc(indicator.name)}</div>`;
    L += `<div class="li-sub"><span class="badge" style="color:${tsColors[indicator.timescale]||'var(--text2)'};border:1px solid ${tsColors[indicator.timescale]||'var(--border)'}">${esc(indicator.timescale||'daily')}</span> ${indicator.states.length} states</div>`;

    E += `<div class="form-group"><label>Name</label><input type="text" value="${esc(ind.name)}" onchange="data.indicators[${selectedIndicator}].name=this.value;saveData();renderWindow()"></div>`;

    E += `<div class="form-group"><label>Description</label><textarea onchange="data.indicators[${selectedIndicator}].description=this.value;saveData()">${esc(ind.description||'')}</textarea></div>`;

    E += `<div class="form-group"><label>Timescale</label><select onchange="data.indicators[${selectedIndicator}].timescale=this.value;saveData();renderWindow()"><option value="immediate"${ind.timescale==='immediate'?' selected':''}>Immediate</option><option value="daily"${ind.timescale==='daily'?' selected':''}>Daily</option><option value="weekly"${ind.timescale==='weekly'?' selected':''}>Weekly</option><option value="act"${ind.timescale==='act'?' selected':''}>Act</option></select></div>`;

    // States table
    E += `<div class="detail-section"><h4>States <button class="btn" style="font-size:10px;padding:2px 8px;margin-left:8px" onclick="data.indicators[${selectedIndicator}].states.push({threshold:0,label:'',visual:''});saveData();renderWindow()">+ Add State</button></h4>`;
    E += `<table class="states-table"><thead><tr><th style="width:80px">Threshold</th><th style="width:120px">Label</th><th>Visual Description</th><th style="width:40px"></th></tr></thead><tbody>`;
    (ind.states || []).forEach((s, si) => {
      const rowColor = s.threshold <= -3 ? 'var(--tug-peace)' : s.threshold >= 3 ? 'var(--tug-war)' : 'var(--tug-neutral)';
      E += `<tr style="border-left:3px solid ${rowColor}">`;
      E += `<td><input type="number" value="${s.threshold}" step="1" onchange="data.indicators[${selectedIndicator}].states[${si}].threshold=parseFloat(this.value)||0;saveData()"></td>`;
      E += `<td><input type="text" value="${esc(s.label)}" onchange="data.indicators[${selectedIndicator}].states[${si}].label=this.value;saveData()"></td>`;
      E += `<td><textarea onchange="data.indicators[${selectedIndicator}].states[${si}].visual=this.value;saveData()">${esc(s.visual)}</textarea></td>`;
      E += `<td><button class="btn btn-danger" style="font-size:10px;padding:2px 6px" onclick="data.indicators[${selectedIndicator}].states.splice(${si},1);saveData();renderWindow()">&times;</button></td>`;
      E += `</tr>`;
    });
    E += `</tbody></table></div>`;

    E += `<div class="form-group"><label>Notes</label><textarea onchange="data.indicators[${selectedIndicator}].notes=this.value;saveData()">${esc(ind.notes||'')}</textarea></div>`;

    // Day snapshot
    E += `<div class="detail-section" style="margin-top:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px">`;
    E += `<h4>Day Snapshot</h4>`;
    E += `<div class="form-group"><label>Day Number</label><input type="number" id="snapshotDay" value="1" min="1" max="80" onchange="renderWindowSnapshot()"></div>`;
    E += `<div id="windowSnapshot"></div>`;
    E += `</div>`;

    E += `<div class="btn-row"><button class="btn btn-danger" onclick="if(confirm('Delete this indicator?')){data.indicators.splice(${selectedIndicator},1);selectedIndicator=0;saveData();renderWindow()}">Delete</button></div>`;

    E += `<div class="empty-state">No indicator selected</div>`;

  E += `</div>`;

  if (ind) renderWindowSnapshot();

function renderWindowSnapshot() {
  const container = document.getElementById('windowSnapshot');
  if (!container) return;
  const dayInput = document.getElementById('snapshotDay');
  const dayNum = parseInt(dayInput?.value) || 1;
  const tugVal = computeTugAtDay(dayNum);

  let html = `<p style="font-size:11px;color:var(--text2);margin-bottom:8px">Tug value at day ${dayNum}: <strong style="color:${tugVal > 5 ? 'var(--tug-war)' : tugVal < -5 ? 'var(--tug-peace)' : 'var(--tug-neutral)'}">${tugVal > 0 ? '+' : ''}${tugVal.toFixed(1)}</strong></p>`;

  data.indicators.forEach(ind => {
    const sorted = [...(ind.states || [])].sort((a, b) => a.threshold - b.threshold);
    let currentState = sorted[0] || { label: 'Unknown', visual: 'No states defined' };
    sorted.forEach(s => { if (tugVal >= s.threshold) currentState = s; });
    const stateColor = currentState.threshold <= -3 ? 'var(--tug-peace)' : currentState.threshold >= 3 ? 'var(--tug-war)' : 'var(--tug-neutral)';
    html += `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px"><strong style="min-width:100px;color:${stateColor}">${esc(ind.name)}</strong><span style="color:var(--text2)">${esc(currentState.label)}</span></div>`;
  });

  container.innerHTML = html;
}

function addIndicator() {
  data.indicators.push({ id:genId(), name:'New Indicator', description:'', timescale:'daily', states:[{threshold:-3,label:'Peace',visual:''},{threshold:0,label:'Neutral',visual:''},{threshold:3,label:'Tension',visual:''},{threshold:5,label:'War',visual:''}], notes:'' });
  selectedIndicator = data.indicators.length - 1;
  saveData();
  renderWindow();
}

// RENDER: SECRET LANGUAGE

  const stageColors = ['var(--pacing-quiet)', 'var(--pacing-routine)', 'var(--pacing-tense)', 'var(--pacing-crisis)', 'var(--pacing-climactic)'];

  data.stages.forEach((s, i) => {
    const color = stageColors[i % stageColors.length];
    L += `<div class="list-item${i === selectedStage ? ' active' : ''}" onclick="selectedStage=${i};renderLanguage()">`;
    L += `<div style="flex:1;min-width:0"><div class="li-name" style="color:${color}">${esc(s.name)}</div>`;
    L += `<div class="li-sub">Days ${s.startDay}-${s.endDay}</div>`;
    L += `</div></div>`;
  });

  L += `</div></div>`;

  let E = `<div class="editor-panel">`;
  if (stage) {
    const color = stageColors[selectedStage % stageColors.length];
    E += `<h2 style="color:${color}">${esc(stage.name)}</h2>`;
    E += `<div class="ep-sub">Days ${stage.startDay} - ${stage.endDay}</div>`;

    E += `<div class="form-group"><label>Name</label><input type="text" value="${esc(stage.name)}" onchange="data.stages[${selectedStage}].name=this.value;saveData();renderLanguage()"></div>`;

    E += `<div class="form-group"><label>Description</label><textarea onchange="data.stages[${selectedStage}].description=this.value;saveData()">${esc(stage.description||'')}</textarea></div>`;

    E += `<div class="form-row"><div class="form-group"><label>Start Day</label><input type="number" value="${stage.startDay||1}" min="1" max="80" onchange="data.stages[${selectedStage}].startDay=parseInt(this.value)||1;saveData();renderLanguage()"></div>`;
    E += `<div class="form-group"><label>End Day</label><input type="number" value="${stage.endDay||80}" min="1" max="80" onchange="data.stages[${selectedStage}].endDay=parseInt(this.value)||80;saveData();renderLanguage()"></div></div>`;

    E += `<div class="form-group"><label>Recognition Trigger</label><textarea onchange="data.stages[${selectedStage}].recognitionTrigger=this.value;saveData()">${esc(stage.recognitionTrigger||'')}</textarea></div>`;

    // Anomalies
    E += `<div class="detail-section"><h4>Anomalies <button class="btn" style="font-size:10px;padding:2px 8px;margin-left:8px" onclick="data.stages[${selectedStage}].anomalies.push({documentId:'',description:'',cipherId:''});saveData();renderLanguage()">+ Add</button></h4>`;
    E += `<p style="font-size:10px;color:var(--text2);margin-bottom:8px">Documents within this stage's day range that teach or test a specific cipher.</p>`;
    (stage.anomalies || []).forEach((a, ai) => {
      const doc = data.documents.find(d => d.id === a.documentId);
      const cipher = data.ciphers.find(c => c.id === a.cipherId);
      // Filter documents by stage day range
      const stageDocs = data.documents.filter(d => d.day >= stage.startDay && d.day <= stage.endDay);
      E += `<div class="card">`;
      E += `<div class="card-head"><span>Anomaly ${ai+1}</span><button class="btn btn-danger" style="font-size:10px;padding:1px 6px" onclick="data.stages[${selectedStage}].anomalies.splice(${ai},1);saveData();renderLanguage()">&times;</button></div>`;
      E += `<div class="form-row"><div class="form-group" style="margin-bottom:6px"><label>Document</label><select onchange="data.stages[${selectedStage}].anomalies[${ai}].documentId=this.value;saveData()"><option value="">Select...</option>${stageDocs.map(d=>`<option value="${d.id}"${a.documentId===d.id?' selected':''}>${esc(d.title)} (Day ${d.day})</option>`).join('')}</select></div>`;
      E += `<div class="form-group" style="margin-bottom:6px"><label>Cipher</label><select onchange="data.stages[${selectedStage}].anomalies[${ai}].cipherId=this.value;saveData()"><option value="">Select...</option>${data.ciphers.map(c=>`<option value="${c.id}"${a.cipherId===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>`;
      E += `<div class="form-group" style="margin-bottom:0"><label>Description</label><textarea style="min-height:40px" onchange="data.stages[${selectedStage}].anomalies[${ai}].description=this.value;saveData()">${esc(a.description)}</textarea></div>`;
      E += `</div>`;
    });
    E += `</div>`;

    E += `<div class="form-group"><label>Notes</label><textarea onchange="data.stages[${selectedStage}].notes=this.value;saveData()">${esc(stage.notes||'')}</textarea></div>`;

    // Pipeline bar visualization
    E += `<div class="detail-section" style="margin-top:16px"><h4>Pipeline Timeline</h4>`;
    E += `<p style="font-size:10px;color:var(--text2);margin-bottom:4px">Days 1-80. Colored bands show each stage. Dots mark anomalies.</p>`;
    const totalDays = 80;
    E += `<div class="pipeline-bar">`;
    data.stages.forEach((s, si) => {
      const sc = stageColors[si % stageColors.length];
      const left = ((s.startDay - 1) / totalDays) * 100;
      const width = ((s.endDay - s.startDay + 1) / totalDays) * 100;
      E += `<div class="pipeline-band" style="left:${left}%;width:${width}%;background:${sc};opacity:0.4">${esc(s.name.substring(0,3))}</div>`;
      // Anomaly dots
      (s.anomalies || []).forEach(a => {
        const doc = data.documents.find(d => d.id === a.documentId);
        if (doc) {
          const dotLeft = ((doc.day - 1) / totalDays) * 100;
          E += `<div class="pipeline-dot" style="left:${dotLeft}%" title="${esc(doc.title)}"></div>`;
        }
      });
    });
    E += `</div>`;
    E += `<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-top:2px"><span>Day 1</span><span>Day 40</span><span>Day 80</span></div>`;
    E += `</div>`;

    E += `<div class="btn-row"><button class="btn btn-danger" onclick="if(confirm('Delete this stage?')){data.stages.splice(${selectedStage},1);selectedStage=0;saveData();renderLanguage()}">Delete</button></div>`;
  } else {
    E += `<div class="empty-state">No stage selected</div>`;
  }
  E += `</div>`;
  tab.innerHTML = L + E;
}

// =====================================================
// RENDER: EXPORT
// =====================================================
function renderExport() {
  const tab = document.getElementById('tab-export');
  let html = '';

  html += `<h2 style="margin-bottom:4px">Export</h2>`;
  html += `<p style="color:var(--text2);font-size:12px;margin-bottom:20px">Full project statistics, validation, and export options.</p>`;

  // Stats
  html += `<div class="export-stats">`;
  html += `<div class="stat-card"><div class="stat-num">${data.characters.length}</div><div class="stat-label">Characters</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.characters.filter(c=>c.household==='epaule').length}</div><div class="stat-label">Epaule</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.characters.filter(c=>c.household==='aguien').length}</div><div class="stat-label">Aguien</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.documents.length}</div><div class="stat-label">Documents</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.documents.filter(d=>d.hiddenLayer&&d.hiddenLayer.encoded).length}</div><div class="stat-label">With Hidden Layer</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.ciphers.length}</div><div class="stat-label">Ciphers</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.days.length}</div><div class="stat-label">Days Planned</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.forces.length}</div><div class="stat-label">Forces</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.indicators.length}</div><div class="stat-label">Indicators</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.stages.length}</div><div class="stat-label">Language Stages</div></div>`;

  const totalEditorial = data.documents.reduce((sum, d) => sum + (d.editorialChoices || []).length, 0);
  html += `<div class="stat-card"><div class="stat-num">${totalEditorial}</div><div class="stat-label">Editorial Choices</div></div>`;

  const totalRels = data.characters.reduce((sum, c) => sum + (c.relationships || []).length, 0);
  html += `<div class="stat-card"><div class="stat-num">${totalRels}</div><div class="stat-label">Relationships</div></div>`;
  html += `</div>`;

  // Full validation
  const issues = getValidationIssues();
  html += `<div class="export-section"><h3>Validation Report</h3>`;
  if (issues.length) {
    const fails = issues.filter(i => i.level === 'fail');
    const warns = issues.filter(i => i.level === 'warn');
    if (fails.length) {
      html += `<div class="validation-group"><h4>Errors <span class="v-count v-fail">${fails.length}</span></h4>`;
      fails.forEach(i => html += `<div class="v-item" style="border-left-color:var(--red)">${esc(i.msg)}</div>`);
      html += `</div>`;
    }
    if (warns.length) {
      html += `<div class="validation-group"><h4>Warnings <span class="v-count v-warn">${warns.length}</span></h4>`;
      warns.forEach(i => html += `<div class="v-item" style="border-left-color:var(--accent3)">${esc(i.msg)}</div>`);
      html += `</div>`;
    }
  } else {
    html += `<div class="v-item" style="border-left-color:var(--green)"><span style="color:var(--green)">All checks passed. No issues found.</span></div>`;
  }
  html += `</div>`;

  // Export actions
  html += `<div class="export-section"><h3>Actions</h3>`;
  html += `<div class="export-actions">`;
  html += `<button class="btn btn-accent" onclick="exportJSON()">Export JSON</button>`;
  html += `<button class="btn" onclick="importJSON()">Import JSON</button>`;
  html += `<button class="btn btn-danger" onclick="if(confirm('Reset all data to defaults? This cannot be undone.')){data=defaultData();saveData();renderCurrentTab()}">Reset to Defaults</button>`;
  html += `</div></div>`;

  // Copy document text
  html += `<div class="export-section"><h3>Copy Document Text</h3>`;
  html += `<div class="form-group"><label>Select Document</label><select id="exportDocSelect" onchange="renderExportDocText()"><option value="">Choose...</option>${data.documents.map((d,i)=>`<option value="${i}">${esc(d.title)} (Day ${d.day})</option>`).join('')}</select></div>`;
  html += `<div id="exportDocText"></div>`;
  html += `</div>`;

  tab.innerHTML = html;
}

function renderExportDocText() {
  const container = document.getElementById('exportDocText');
  const sel = document.getElementById('exportDocSelect');
  if (!container || !sel) return;
  const idx = parseInt(sel.value);
  if (isNaN(idx) || idx < 0 || idx >= data.documents.length) { container.innerHTML = ''; return; }
  const doc = data.documents[idx];

  let html = `<div class="export-code">${esc(doc.surfaceText || '(no surface text)')}</div>`;
  html += `<button class="btn" style="margin-top:8px" onclick="navigator.clipboard.writeText(data.documents[${idx}].surfaceText||'').then(()=>alert('Copied!'))">Copy to Clipboard</button>`;

  if (doc.hiddenLayer && doc.hiddenLayer.encoded) {
    html += `<div style="margin-top:12px"><h4 style="font-size:11px;color:var(--channel-candlelight);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Hidden Layer</h4>`;
    html += `<div class="export-code">${esc(doc.hiddenLayer.encoded)}</div></div>`;
  }

  container.innerHTML = html;
}

// =====================================================
// KEYBOARD SHORTCUTS
// =====================================================
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
});

// =====================================================
// INIT
// =====================================================
loadData();
switchTab('overview');
</script>
</body>
</html>
