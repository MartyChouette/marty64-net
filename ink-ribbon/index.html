<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Ribbon - Weaver</title>
<style>
:root {
  --bg: #0e0c0a;
  --bg2: #151210;
  --bg3: #1c1814;
  --surface: #141210;
  --surface2: #1e1a16;
  --border: #2e2822;
  --text: #e8e0d4;
  --text2: #8a7e6e;
  --accent: #6a7e8c;
  --accent2: #b89a6a;
  --accent3: #d4a850;
  --accent4: #c8b898;
  --green: #6aaa6a;
  --red: #c85040;
  --blue: #5a8aaa;
  --yellow: #d4a850;
  --aurinian: #b83030;
  --serennan: #d8d0c8;
  --helvetan: #4878a8;
  --trentaran: #7a68a8;
  --supervision-close: #c85040;
  --supervision-checked: #d4a850;
  --supervision-glanced: #6aaa6a;
  --supervision-unattended: #5a8aaa;
  --doc-dictation: #c85040;
  --doc-copywork: #8a7e6e;
  --doc-incoming: #4878a8;
  --doc-outgoing: #6aaa6a;
  --doc-trade: #d4a850;
  --doc-personal: #7a68a8;
  --channel-daylight: #d4a850;
  --channel-candlelight: #c8884a;
  --channel-physical: #8a7e6e;
  --tug-peace: #6aaa6a;
  --tug-war: #c85040;
  --tug-neutral: #d4a850;
  --pacing-quiet: #5a8aaa;
  --pacing-routine: #6aaa6a;
  --pacing-tense: #d4a850;
  --pacing-crisis: #c85040;
  --pacing-climactic: #b83030;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
body::before { content:''; position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:0.035; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); background-size:128px 128px; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* Top nav */
#topbar { display: flex; align-items: center; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 16px; height: 48px; gap: 4px; }
#topbar h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; color: var(--text); margin-right: 16px; letter-spacing: 1px; font-weight: 400; text-shadow: 0 0 30px rgba(184,154,106,0.3); }
#topbar h1 em { color: var(--accent2); font-style: italic; }
#topbar h1 span { color: var(--text2); font-family: 'Consolas', 'Courier New', monospace; font-style: normal; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; vertical-align: super; }
.tab-btn { background: none; border: none; color: var(--text2); padding: 12px 14px; cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent2); text-shadow: 0 0 12px rgba(184,154,106,0.4); }
#topbar .spacer { flex: 1; }
.save-indicator { font-size: 11px; color: var(--green); opacity: 0; transition: opacity 0.3s; margin-right: 4px; }
.save-indicator.show { opacity: 1; }
.top-action { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 4px; }
.top-action:hover { background: var(--accent2); color: #000; }

/* Main content */
#content { overflow: hidden; position: relative; }
.tab-content { display: none; height: 100%; overflow: hidden; }
.tab-content.active { display: flex; }

/* Split view layout */
.split-view { flex-direction: row; }
.side-list { width: 240px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
.side-list h3 { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
.side-list h3 button { background: none; border: 1px dashed var(--border); color: var(--accent3); padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
.side-list h3 button:hover { border-color: var(--accent3); background: rgba(212,168,80,0.1); }
.list-items { flex: 1; overflow-y: auto; }
.list-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid rgba(46,40,34,0.5); transition: background 0.15s; position: relative; }
.list-item:hover { background: var(--surface2); }
.list-item.active { background: var(--bg3); border-left: 3px solid var(--accent2); box-shadow: inset 0 0 20px rgba(184,154,106,0.06); }
.list-item .li-name { font-size: 13px; font-weight: 600; }
.list-item .li-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.list-item .li-tag { font-size: 9px; padding: 1px 6px; border-radius: 3px; display: inline-block; margin-top: 3px; }
.editor-panel { flex: 1; overflow-y: auto; padding: 24px; max-width: 900px; }
.editor-panel h2 { font-size: 20px; margin-bottom: 4px; text-shadow: 0 0 20px rgba(184,154,106,0.2); }
.editor-panel .ep-sub { color: var(--text2); font-size: 12px; margin-bottom: 20px; }

/* Form controls */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.form-group textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 4px; font-family: inherit; font-size: 13px; line-height: 1.6; resize: vertical; min-height: 80px; }
.form-group textarea:focus { outline: none; border-color: var(--accent2); }
.form-group textarea.mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
.form-group input[type=text], .form-group input[type=number], .form-group input[type=color], .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 4px; font-size: 13px; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent2); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

/* Detail sections */
.detail-section { margin-bottom: 16px; }
.detail-section h4 { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

/* Cards */
.card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
.card .card-head { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.card .card-body { font-size: 12px; color: var(--text2); line-height: 1.5; }
.card textarea { width: 100%; min-height: 50px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 4px; font-family: inherit; font-size: 12px; line-height: 1.5; resize: vertical; }
.card textarea:focus { outline: none; border-color: var(--accent2); }

/* Tags */
.tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); cursor: default; }
.tag.removable { cursor: pointer; }
.tag.removable:hover { border-color: var(--red); color: var(--red); }

/* Reorder controls on list items */
.reorder-btns { display: flex; flex-direction: column; gap: 0; margin-left: auto; flex-shrink: 0; opacity: 0.4; transition: opacity 0.15s; }
.list-item:hover .reorder-btns, .list-item.active .reorder-btns { opacity: 1; }
.reorder-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 10px; padding: 2px 6px; line-height: 1; border-radius: 3px; }
.reorder-btn:hover { background: var(--bg3); color: var(--text); }

/* Buttons */
.btn { padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; background: var(--surface); color: var(--text); }
.btn:hover { background: var(--bg3); }
.btn-accent { background: var(--accent2); border-color: var(--accent2); color: #000; }
.btn-accent:hover { opacity: 0.85; }
.btn-danger { color: var(--red); border-color: transparent; background: none; }
.btn-danger:hover { background: rgba(200,80,64,0.1); }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }

/* Badges */
.badge { font-size: 9px; padding: 2px 6px; border-radius: 3px; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; }
.badge-close { background: rgba(200,80,64,0.2); color: var(--supervision-close); border: 1px solid var(--supervision-close); }
.badge-checked { background: rgba(212,168,80,0.2); color: var(--supervision-checked); border: 1px solid var(--supervision-checked); }
.badge-glanced { background: rgba(106,170,106,0.2); color: var(--supervision-glanced); border: 1px solid var(--supervision-glanced); }
.badge-unattended { background: rgba(90,138,170,0.2); color: var(--supervision-unattended); border: 1px solid var(--supervision-unattended); }

.badge-dictation { background: rgba(200,80,64,0.15); color: var(--doc-dictation); border: 1px solid var(--doc-dictation); }
.badge-copywork { background: rgba(138,126,110,0.15); color: var(--doc-copywork); border: 1px solid var(--doc-copywork); }
.badge-incoming { background: rgba(72,120,168,0.15); color: var(--doc-incoming); border: 1px solid var(--doc-incoming); }
.badge-outgoing { background: rgba(106,170,106,0.15); color: var(--doc-outgoing); border: 1px solid var(--doc-outgoing); }
.badge-trade { background: rgba(212,168,80,0.15); color: var(--doc-trade); border: 1px solid var(--doc-trade); }
.badge-personal { background: rgba(122,104,168,0.15); color: var(--doc-personal); border: 1px solid var(--doc-personal); }

.badge-daylight { background: rgba(212,168,80,0.15); color: var(--channel-daylight); border: 1px solid var(--channel-daylight); }
.badge-candlelight { background: rgba(200,136,74,0.15); color: var(--channel-candlelight); border: 1px solid var(--channel-candlelight); }
.badge-physical { background: rgba(138,126,110,0.15); color: var(--channel-physical); border: 1px solid var(--channel-physical); }

.badge-quiet { background: rgba(90,138,170,0.15); color: var(--pacing-quiet); border: 1px solid var(--pacing-quiet); }
.badge-routine { background: rgba(106,170,106,0.15); color: var(--pacing-routine); border: 1px solid var(--pacing-routine); }
.badge-tense { background: rgba(212,168,80,0.15); color: var(--pacing-tense); border: 1px solid var(--pacing-tense); }
.badge-crisis { background: rgba(200,80,64,0.15); color: var(--pacing-crisis); border: 1px solid var(--pacing-crisis); }
.badge-climactic { background: rgba(184,48,48,0.15); color: var(--pacing-climactic); border: 1px solid var(--pacing-climactic); }

/* Color dot */
.char-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

/* Political alignment slider */
.alignment-bar { width: 100%; height: 24px; border-radius: 12px; background: linear-gradient(to right, var(--serennan) 0%, var(--trentaran) 30%, var(--accent3) 50%, var(--helvetan) 70%, var(--aurinian) 100%); position: relative; cursor: pointer; border: 1px solid var(--border); }
.alignment-bar .alignment-marker { position: absolute; top: -2px; width: 16px; height: 28px; background: var(--text); border-radius: 8px; border: 2px solid var(--bg); transform: translateX(-50%); pointer-events: none; }
.alignment-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--text2); margin-top: 2px; }

/* Collapsible groups */
.collapsible-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; cursor: pointer; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); user-select: none; }
.collapsible-header:hover { background: var(--surface2); color: var(--text); }
.collapsible-header .chevron { transition: transform 0.2s; font-size: 10px; }
.collapsible-header.collapsed .chevron { transform: rotate(-90deg); }
.collapsible-body { overflow: hidden; }
.collapsible-body.collapsed { display: none; }

/* Tug of war bar */
.tug-bar { width: 100%; height: 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; position: relative; overflow: hidden; }
.tug-bar .tug-fill-peace { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(to right, var(--tug-peace), transparent); border-radius: 10px 0 0 10px; }
.tug-bar .tug-fill-war { position: absolute; right: 0; top: 0; bottom: 0; background: linear-gradient(to left, var(--tug-war), transparent); border-radius: 0 10px 10px 0; }
.tug-bar .tug-center { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--text2); transform: translateX(-50%); }
.tug-bar .tug-needle { position: absolute; top: -2px; width: 12px; height: 24px; background: var(--accent3); border-radius: 6px; border: 2px solid var(--bg); transform: translateX(-50%); pointer-events: none; }
.tug-mini-bar { width: 60px; height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; display: inline-block; position: relative; overflow: hidden; vertical-align: middle; }
.tug-mini-bar .tug-mini-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }

/* Day row layout for Day Planner */
.day-row { display: flex; gap: 0; margin-bottom: 4px; min-height: 60px; }
.day-label { width: 70px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text2); background: var(--surface); border: 1px solid var(--border); border-radius: 4px 0 0 4px; gap: 2px; }
.day-label .day-num { font-size: 20px; color: var(--text); }
.day-content { flex: 1; background: var(--surface); border: 1px solid var(--border); border-left: none; border-radius: 0 4px 4px 0; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.day-row-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.day-row-label { font-size: 9px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; width: 55px; flex-shrink: 0; }
.day-chip { font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; transition: all 0.15s; }
.day-chip:hover { border-color: var(--accent2); transform: translateY(-1px); }
.day-pacing-bar { height: 3px; border-radius: 2px; margin-top: 2px; }
.day-pacing-bar.quiet { background: var(--pacing-quiet); }
.day-pacing-bar.routine { background: var(--pacing-routine); }
.day-pacing-bar.tense { background: var(--pacing-tense); }
.day-pacing-bar.crisis { background: var(--pacing-crisis); }
.day-pacing-bar.climactic { background: var(--pacing-climactic); }

/* Act headers */
.act-header { font-size: 14px; font-weight: 700; color: var(--accent2); margin: 16px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

/* Simulation chart */
.sim-chart { width: 100%; height: 60px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; position: relative; overflow: hidden; margin-top: 12px; }
.sim-chart .sim-zone { position: absolute; top: 0; bottom: 0; }
.sim-chart .sim-zone.green { background: rgba(106,170,106,0.1); }
.sim-chart .sim-zone.yellow { background: rgba(212,168,80,0.1); }
.sim-chart .sim-zone.red { background: rgba(200,80,64,0.1); }
.sim-chart .sim-bar { position: absolute; bottom: 0; width: 8px; border-radius: 4px 4px 0 0; transition: height 0.3s; }
.sim-chart .sim-center { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--text2); opacity: 0.3; }

/* Pipeline bar visualization */
.pipeline-bar { width: 100%; height: 32px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; position: relative; overflow: hidden; margin-top: 12px; }
.pipeline-band { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--bg); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.pipeline-dot { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 1px solid var(--bg); transform: translate(-50%, -50%); }

/* Window indicator states table */
.states-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.states-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.states-table td { padding: 6px 8px; border-bottom: 1px solid rgba(46,40,34,0.3); }
.states-table td input, .states-table td textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px 6px; border-radius: 3px; font-size: 12px; font-family: inherit; }
.states-table td textarea { min-height: 40px; resize: vertical; }
.states-table td input:focus, .states-table td textarea:focus { outline: none; border-color: var(--accent2); }

/* Export */
.export-section { margin-bottom: 20px; }
.export-section h3 { font-size: 14px; margin-bottom: 8px; color: var(--accent3); }
.export-code { background: #0d0c0a; border: 1px solid var(--border); border-radius: 6px; padding: 16px; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 400px; white-space: pre; color: var(--text); }
.export-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.export-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; text-align: center; }
.stat-card .stat-num { font-size: 28px; font-weight: 700; color: var(--accent2); text-shadow: 0 0 16px rgba(184,154,106,0.3); }
.stat-card .stat-label { font-size: 11px; color: var(--text2); margin-top: 4px; }

/* Validation */
.validation-group { margin-bottom: 16px; }
.validation-group h4 { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.validation-group h4 .v-count { font-size: 10px; padding: 2px 6px; border-radius: 10px; }
.v-pass { color: var(--green); border: 1px solid var(--green); }
.v-warn { color: var(--accent3); border: 1px solid var(--accent3); }
.v-fail { color: var(--red); border: 1px solid var(--red); }
.v-item { font-size: 12px; padding: 6px 10px; border-left: 3px solid; margin-bottom: 4px; background: var(--bg); border-radius: 0 4px 4px 0; }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; color: var(--text2); font-size: 13px; }

/* Overview full width */
.full-width { flex-direction: column; overflow-y: auto; padding: 24px; gap: 0; }
.overview-premise { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; line-height: 1.7; font-size: 14px; }
.workflow-step { display: flex; align-items: flex-start; gap: 12px; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }
.workflow-step:hover { border-color: var(--accent2); }
.workflow-step .ws-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent2); color: #000; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.workflow-step .ws-text { font-size: 12px; line-height: 1.5; }
.workflow-step .ws-text strong { color: var(--accent2); }

/* Hidden layer indicator icon */
.hidden-icon { font-size: 10px; color: var(--channel-candlelight); margin-left: 4px; }

/* Complexity dots */
.complexity-dots { display: flex; gap: 3px; align-items: center; }
.complexity-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); }
.complexity-dot.filled { background: var(--accent3); border-color: var(--accent3); }

/* Scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4a4038; }

/* Vignette */
#content::after { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 60%, rgba(14,12,10,0.4) 100%); z-index:0; }

/* Mobile sidebar toggle */
.mobile-toggle { display: none; width: 100%; padding: 10px 16px; background: var(--surface2); border: none; border-bottom: 1px solid var(--border); color: var(--accent2); font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; flex-shrink: 0; }
.mobile-toggle::after { content: ' \25BC'; font-size: 10px; opacity: 0.6; }
.mobile-toggle.collapsed::after { content: ' \25B6'; }

/* Responsive */
@media (max-width: 1024px) {
  .side-list { width: 200px; }
  .form-row { grid-template-columns: 1fr; }
  .form-row-3 { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  html, body { height: 100dvh; }
  #app { height: 100dvh; }
  #topbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; height: auto; min-height: 44px; padding: 0 8px; gap: 0; }
  #topbar::-webkit-scrollbar { display: none; }
  #topbar h1 { font-size: 12px; margin-right: 6px; flex-shrink: 0; letter-spacing: 2px; }
  #topbar h1 span { display: none; }
  .tab-btn { padding: 12px 10px; font-size: 11px; flex-shrink: 0; min-height: 44px; }
  .spacer { flex: 0 0 4px; }
  .top-action { padding: 8px 10px; font-size: 11px; flex-shrink: 0; min-height: 36px; }

  .split-view { flex-direction: column !important; }
  .mobile-toggle { display: block; }
  .side-list {
    width: 100% !important; max-height: 40vh; border-right: none !important; border-bottom: 1px solid var(--border);
    overflow-y: auto; transition: max-height 0.25s ease;
  }
  .side-list.collapsed { max-height: 0 !important; overflow: hidden; border-bottom: none; }
  .side-list h3 { position: sticky; top: 0; background: var(--surface); z-index: 2; }

  .list-item { padding: 14px 16px; min-height: 48px; }

  .reorder-btns { opacity: 1; }
  .reorder-btn { font-size: 16px; padding: 6px 10px; min-width: 36px; min-height: 28px; display: flex; align-items: center; justify-content: center; }

  .editor-panel { padding: 16px; max-width: 100% !important; }
  .form-group textarea { font-size: 16px; padding: 12px; min-height: 90px; line-height: 1.5; }
  .form-group input[type=text], .form-group input[type=number], .form-group select { font-size: 16px; padding: 12px; min-height: 44px; }
  .form-group label { font-size: 12px; margin-bottom: 6px; }

  .btn { min-height: 40px; padding: 10px 16px; font-size: 13px; }
  .btn-row { flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 4px 10px; min-height: 28px; display: inline-flex; align-items: center; }

  .full-width { padding: 14px; }
  .export-stats { grid-template-columns: repeat(3, 1fr); }
  .stat-card .stat-num { font-size: 22px; }
  .export-actions { flex-direction: column; }
  .export-code { font-size: 10px; max-height: 300px; }

  .day-row { flex-direction: column; min-height: auto; margin-bottom: 8px; }
  .day-label { width: 100%; flex-direction: row; justify-content: flex-start; gap: 8px; padding: 8px 12px; border-radius: 4px 4px 0 0; }
  .day-label .day-num { font-size: 16px; }
  .day-content { border-radius: 0 0 4px 4px; border-left: 1px solid var(--border); padding: 10px; }
  .day-chip { font-size: 12px; padding: 6px 10px; min-height: 32px; display: inline-flex; align-items: center; }
}

@media (max-width: 420px) {
  #topbar h1 { display: none; }
  .tab-btn { padding: 10px 8px; font-size: 10px; }
  .export-stats { grid-template-columns: repeat(2, 1fr); }
}

@supports (padding: env(safe-area-inset-top)) {
  #topbar { padding-top: env(safe-area-inset-top); padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  .full-width { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
  .editor-panel { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
}

@media (max-height: 500px) and (max-width: 900px) {
  .side-list { max-height: 25vh; }
}

<body>

<div id="app">
  <div id="topbar">
    <h1><em>Ink Ribbon</em> <span>Weaver</span></h1>
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
    <button class="tab-btn" data-tab="characters" onclick="switchTab('characters')">Households</button>
    <button class="tab-btn" data-tab="documents" onclick="switchTab('documents')">Documents</button>
    <button class="tab-btn" data-tab="ciphers" onclick="switchTab('ciphers')">Ciphers</button>
    <button class="tab-btn" data-tab="days" onclick="switchTab('days')">Day Planner</button>
    <button class="tab-btn" data-tab="tugofwar" onclick="switchTab('tugofwar')">Tug of War</button>
    <button class="tab-btn" data-tab="window" onclick="switchTab('window')">Street Window</button>
    <button class="tab-btn" data-tab="language" onclick="switchTab('language')">Secret Language</button>
    <button class="tab-btn" data-tab="export" onclick="switchTab('export')">Export</button>
    <div class="spacer"></div>
    <span class="save-indicator" id="saveInd">Saved</span>
    <button class="top-action" onclick="undo()" title="Undo">&#8630;</button>
    <button class="top-action" onclick="redo()" title="Redo">&#8631;</button>
    <button class="top-action" onclick="exportJSON()">Export</button>
    <button class="top-action" onclick="importJSON()">Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
  </div>
  <div id="content">
    <div id="tab-overview" class="tab-content full-width active"></div>
    <div id="tab-characters" class="tab-content split-view"></div>
    <div id="tab-documents" class="tab-content split-view"></div>
    <div id="tab-ciphers" class="tab-content split-view"></div>
    <div id="tab-days" class="tab-content full-width"></div>
    <div id="tab-tugofwar" class="tab-content split-view"></div>
    <div id="tab-window" class="tab-content split-view"></div>
    <div id="tab-language" class="tab-content split-view"></div>
    <div id="tab-export" class="tab-content full-width"></div>
  </div>
</div>

<script>
// =====================================================
// UTILITIES
// =====================================================
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// =====================================================
// STATE
// =====================================================
const STORAGE_KEY = 'ink_ribbon_weaver';
let data = null;
let currentTab = 'overview';
let selectedChar = 0;
let selectedDoc = 0;
let selectedCipher = 0;
let selectedForce = 0;
let selectedIndicator = 0;
let selectedStage = 0;
const undoStack = [];
const redoStack = [];
const MAX_UNDO = 50;

// =====================================================
// UNDO / REDO
// =====================================================
function pushUndo() {
  undoStack.push(JSON.stringify(data));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(data));
  data = JSON.parse(undoStack.pop());
  ensureDataStructure();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderCurrentTab();
  flashSave('Undone');
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(data));
  data = JSON.parse(redoStack.pop());
  ensureDataStructure();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderCurrentTab();
  flashSave('Redone');
}

// =====================================================
// SAVE / LOAD
// =====================================================
function flashSave(msg) {
  const ind = document.getElementById('saveInd');
  ind.textContent = msg || 'Saved';
  ind.classList.add('show');
  setTimeout(() => { ind.classList.remove('show'); ind.textContent = 'Saved'; }, 1500);
}

function saveData() {
  pushUndo();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  flashSave();
}

function loadData() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) { try { data = JSON.parse(stored); ensureDataStructure(); } catch(e) { data = defaultData(); } }
  else { data = defaultData(); }
}

function ensureDataStructure() {
  if (!data) data = defaultData();
  if (!data.characters) data.characters = [];
  if (!data.documents) data.documents = [];
  if (!data.ciphers) data.ciphers = [];
  if (!data.days) data.days = [];
  if (!data.forces) data.forces = [];
  if (!data.indicators) data.indicators = [];
  if (!data.stages) data.stages = [];
  data.characters.forEach(c => {
    if (!c.relationships) c.relationships = [];
    if (!c.arc) c.arc = {};
  });
  data.documents.forEach(d => {
    if (!d.hiddenLayer) d.hiddenLayer = { ciphers: [], encoded: '', method: '', workedExample: '' };
    if (!d.editorialChoices) d.editorialChoices = [];
  });
  data.ciphers.forEach(c => {
    if (!c.dependencies) c.dependencies = [];
  });
  data.indicators.forEach(ind => {
    if (!ind.states) ind.states = [];
  });
  data.stages.forEach(s => {
    if (!s.anomalies) s.anomalies = [];
  });
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ink_ribbon_data.json'; a.click();
}
function importJSON() { document.getElementById('importFile').click(); }
function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try { data = JSON.parse(ev.target.result); ensureDataStructure(); saveData(); renderCurrentTab(); alert('Imported!'); }
    catch(err) { alert('Failed: ' + err.message); }
  };
  reader.readAsText(file); e.target.value = '';
}

// =====================================================
// TAB SYSTEM
// =====================================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-'+tab));
  renderCurrentTab();
}

function renderCurrentTab() {
  switch(currentTab) {
    case 'overview': renderOverview(); break;
    case 'characters': renderCharacters(); break;
    case 'documents': renderDocuments(); break;
    case 'ciphers': renderCiphers(); break;
    case 'days': renderDays(); break;
    case 'tugofwar': renderTugOfWar(); break;
    case 'window': renderWindow(); break;
    case 'language': renderLanguage(); break;
    case 'export': renderExport(); break;
  }
}

function toggleSidebar(btn) {
  const list = btn.nextElementSibling;
  if (list && list.classList.contains('side-list')) {
    list.classList.toggle('collapsed');
    btn.classList.toggle('collapsed');
  }
}

// =====================================================
// HELPER FUNCTIONS
// =====================================================
function getCharName(id) {
  const c = data.characters.find(ch => ch.id === id);
  return c ? c.name : id || 'Unknown';
}
function getDocTypeBadge(type) {
  const map = { official_dictation:'dictation', copywork:'copywork', incoming_aguien:'incoming', outgoing_aguien:'outgoing', helvetan_trade:'trade', personal_letter:'personal' };
  const cls = map[type] || 'copywork';
  const label = type ? type.replace(/_/g,' ') : 'unknown';
  return `<span class="badge badge-${cls}">${esc(label)}</span>`;
}
function getSupervisionBadge(sup) {
  const cls = sup || 'unattended';
  return `<span class="badge badge-${cls}">${esc(cls)}</span>`;
}
function getPacingBadge(pacing) {
  return `<span class="badge badge-${pacing||'routine'}">${esc(pacing||'routine')}</span>`;
}
function getChannelBadge(channel) {
  return `<span class="badge badge-${channel||'daylight'}">${esc(channel||'daylight')}</span>`;
}

function computeTugAtDay(dayNum) {
  let val = 0;
  data.forces.forEach(f => {
    const start = f.startDay || 1;
    const end = f.endDay || 999;
    if (dayNum < start || dayNum > end) return;
    const dir = f.direction === 'war' ? 1 : -1;
    if (f.source === 'constant') {
      val += dir * (f.magnitude || 0) * (dayNum - start + 1);
    } else {
      val += dir * (f.magnitude || 0);
    }
  });
  // Add editorial choices from documents on or before this day
  data.documents.forEach(doc => {
    if (doc.day <= dayNum) {
      (doc.editorialChoices || []).forEach(ec => {
        val += (ec.tugEffect || 0);
      });
    }
  });
  return val;
}

function reorder(arr, idx, dir) {
  const ni = idx + dir;
  if (ni < 0 || ni >= arr.length) return;
  [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
  saveData();
}

function getValidationIssues() {
  const issues = [];
  // Characters without personality
  data.characters.forEach(c => {
    if (!c.personality || c.personality.trim().length < 10) issues.push({ level:'warn', msg:`Character "${c.name}" has minimal personality description` });
  });
  // Documents without surface text
  data.documents.forEach(d => {
    if (!d.surfaceText || d.surfaceText.trim().length < 5) issues.push({ level:'warn', msg:`Document "${d.title}" has no surface text` });
  });
  // Documents with hidden layer but no cipher selected
  data.documents.forEach(d => {
    if (d.hiddenLayer && d.hiddenLayer.encoded && d.hiddenLayer.encoded.trim() && (!d.hiddenLayer.ciphers || !d.hiddenLayer.ciphers.length)) {
      issues.push({ level:'fail', msg:`Document "${d.title}" has hidden content but no cipher selected` });
    }
  });
  // Days without documents
  data.days.forEach(day => {
    const docs = data.documents.filter(d => d.day === day.dayNumber);
    if (!docs.length) issues.push({ level:'warn', msg:`Day ${day.dayNumber} has no documents assigned` });
  });
  // Ciphers with dependencies that don't exist
  data.ciphers.forEach(c => {
    (c.dependencies || []).forEach(dep => {
      if (!data.ciphers.find(cc => cc.id === dep)) issues.push({ level:'fail', msg:`Cipher "${c.name}" depends on unknown cipher "${dep}"` });
    });
  });
  // Cipher discovery day after it's first used in a document
  data.ciphers.forEach(c => {
    const firstUse = data.documents.filter(d => d.hiddenLayer && d.hiddenLayer.ciphers && d.hiddenLayer.ciphers.includes(c.id)).map(d => d.day).sort((a,b) => a-b)[0];
    if (firstUse && firstUse < c.discoveryDay) issues.push({ level:'fail', msg:`Cipher "${c.name}" first used on day ${firstUse} but not discovered until day ${c.discoveryDay}` });
  });
  // Forces without magnitude
  data.forces.forEach(f => {
    if (!f.magnitude || f.magnitude === 0) issues.push({ level:'warn', msg:`Force "${f.name}" has no magnitude` });
  });
  // Language stages with overlapping day ranges
  for (let i = 0; i < data.stages.length - 1; i++) {
    const s = data.stages[i];
    const next = data.stages[i+1];
    if (s.endDay > next.startDay) issues.push({ level:'warn', msg:`Language stage "${s.name}" overlaps with "${next.name}"` });
  }
  return issues;
}

// =====================================================
// DEFAULT DATA
// =====================================================
function defaultData() {
  return {
    characters: [
      // EPAULE HOUSEHOLD
      { id:'epaule_patriarch', name:'The Patriarch (Mayor)', color:'#d8d0c8', household:'epaule', role:'Mayor of the border town', alignment:-2, personality:'Pragmatist. Serves Serennan interests because his position requires it, but privately uncertain whether the empire he administers for is worth what it costs. Makes decisions slowly and expects them to be carried out quickly.', arc:{ act1:'Establishes authority. Dictates official correspondence with careful, measured language.', act2:'Increasingly pressured by both sides. His dictation grows more guarded.', act3:'Must choose between institutional loyalty and the safety of his household.' }, playerInfluence:'The player types his dictated letters. What the player chooses to include, omit, or subtly alter shapes the town\'s diplomatic posture.', relationships:[{targetId:'epaule_matriarch',description:'Married. She is more ideological than him. He respects her conviction but fears where it leads.'},{targetId:'player_typist',description:'Employer. Trusts the typist with sensitive correspondence. Does not know the typist has opinions.'}], notes:'His alignment of -2 means he leans Serennan but is not committed.' },
      { id:'epaule_matriarch', name:'The Matriarch', color:'#d8d0c8', household:'epaule', role:'Serennan nationalist, social anchor', alignment:-4, personality:'True believer in Serennan sovereignty. Sees the Aurinian Empire as an occupying force wrapped in trade agreements. Hosts gatherings. Speaks carefully in public and freely in private. Her nationalism is principled, not performative.', arc:{ act1:'Social events. Her views are clear to anyone listening.', act2:'Her conviction hardens as tensions rise. Begins dictating her own correspondence.', act3:'Faces consequences of her own certainty.' }, playerInfluence:'When she dictates, her language is more charged. The player must decide how faithfully to transcribe her words.', relationships:[{targetId:'epaule_patriarch',description:'Married. Pushes him toward stronger Serennan positions. Frustrated by his caution.'}], notes:'Alignment -4. The household\'s ideological center of gravity.' },
      { id:'epaule_eldest', name:'The Eldest', color:'#d8d0c8', household:'epaule', role:'Heir, swing vote', alignment:-1, personality:'Pragmatic like the father but more open-minded. Sees merit in multiple perspectives. The one most likely to change position based on new information. Not indecisive but genuinely uncommitted.', arc:{ act1:'Observes. Listens to both parents.', act2:'Begins forming independent opinions. May start writing letters of their own.', act3:'Their choice matters. Which way they lean affects the household\'s final position.' }, playerInfluence:'If the player builds a cipher relationship with the Eldest, they become an ally. If not, they follow their parents.', relationships:[{targetId:'epaule_younger',description:'Sibling. Protective but sometimes dismissive of the younger one\'s idealism.'}], notes:'Alignment -1. The pivot point in the Epaule household.' },
      { id:'epaule_younger', name:'The Younger', color:'#7a68a8', household:'epaule', role:'Trentaran idealist', alignment:0, personality:'Romantic about Trentaran philosophy and culture. Reads banned books. Believes in a world beyond empires and borders. Naive in the way only someone who has never had to make a hard choice can be. Sincere.', arc:{ act1:'Quiet enthusiasm. Leaves Trentaran texts where the player might find them.', act2:'Becomes more outspoken as the stakes rise. Risks drawing attention.', act3:'Must reckon with the gap between ideals and the world that contains them.' }, playerInfluence:'The player can protect the Younger by hiding evidence of their reading habits, or expose them by leaving things in the open.', relationships:[{targetId:'epaule_eldest',description:'Sibling. Looks up to the Eldest. Wants their approval.'}], notes:'Alignment 0, but philosophically Trentaran. The household\'s conscience.' },
      { id:'epaule_uncle', name:'The Uncle', color:'#4878a8', household:'epaule', role:'Helvetan opportunist', alignment:0, personality:'Trader. Connected to Helvetan merchant networks. Not ideological in the way the Matriarch is. Sees borders as obstacles to commerce. Friendly, practical, and impossible to pin down politically. Always has a deal in progress.', arc:{ act1:'Brings trade documents through. Casual presence.', act2:'His trade connections become strategically important.', act3:'Must decide whether his business relationships are worth more than family loyalty.' }, playerInfluence:'Trade documents pass through the player. The Uncle\'s correspondence reveals supply chain information that both sides want.', relationships:[{targetId:'epaule_patriarch',description:'Brother. Respects the Patriarch\'s position but thinks politics is a waste of perfectly good commerce.'}], notes:'Alignment 0. Helvetan by disposition, not nationality.' },
      { id:'zia', name:'Zia (Housekeeper)', color:'#8a7e6e', household:'epaule', role:'Housekeeper, observer', alignment:0, personality:'Sees everything. Says little. Has worked in the household long enough to know where all the seams are. Not a servant in the feudal sense but a permanent fixture of the domestic architecture. Loyal to the household itself, not to any member of it.', arc:{ act1:'Background presence. Cleans around the player.', act2:'Begins leaving small observations. Not notes. Objects placed in meaningful positions.', act3:'Her knowledge of the household becomes either protective or dangerous.' }, playerInfluence:'The player can read Zia\'s spatial messages or ignore them. She communicates through arrangement, not language.', relationships:[{targetId:'player_typist',description:'Coworker in the domestic sense. Watches the player with neither suspicion nor warmth.'}], notes:'Alignment 0. Neutral but not uninvolved.' },
      { id:'player_typist', name:'The Player (Typist)', color:'#c8b898', household:'epaule', role:'Typist, the player character', alignment:0, personality:'The player. Works in the Epaule household as a professional typist. Types what is dictated. What happens between the dictation and the page is the entire game.', arc:{ act1:'Learning the job. Building relationships with both households through correspondence.', act2:'Active choices. Editorial control. Cipher engagement.', act3:'The typist\'s accumulated choices determine the outcome.' }, playerInfluence:'This is the player. Everything is player influence.', relationships:[], notes:'Alignment 0. The player sets this through their actions.' },
      // AGUIEN HOUSEHOLD
      { id:'aguien_patriarch', name:'The Patriarch (Ambassador)', color:'#b83030', household:'aguien', role:'Aurinian ambassador, duty-bound', alignment:2, personality:'Career diplomat. Believes in the empire not because it is good but because the alternative is chaos. Duty is his operating principle. Personally decent. Professionally immovable. The kind of person who follows orders he privately questions because he believes the system that issues them is larger than any individual failure.', arc:{ act1:'Arrives. Establishes the Aurinian presence. Formal, correct.', act2:'The orders he receives grow harder to justify. His correspondence becomes more careful.', act3:'Duty versus conscience. The system he serves demands something he cannot stomach.' }, playerInfluence:'His outgoing correspondence passes through channels the player can observe. The player sees the gap between what he is told and what he writes.', relationships:[{targetId:'aguien_matriarch',description:'Married. She softens his institutional edges. He worries about her Trentaran connections.'},{targetId:'imperial_cousin',description:'Extended family. The Cousin represents the empire\'s harder edge. The Ambassador manages him.'}], notes:'Alignment 2. Aurinian by duty, not enthusiasm.' },
      { id:'aguien_matriarch', name:'The Matriarch (Aguien)', color:'#7a68a8', household:'aguien', role:'Born Trentaran, bridge figure', alignment:0, personality:'Born Trentaran, married into the Aurinian diplomatic household. Navigates both worlds. Not a spy or a double agent. A person who contains contradictions and does not resolve them. Speaks multiple languages and understands what gets lost in translation.', arc:{ act1:'Gracious hostess. Social bridge between households.', act2:'Her Trentaran origins become politically relevant. Both sides want her loyalty.', act3:'She cannot remain a bridge when the bridge is burning.' }, playerInfluence:'Her correspondence is personal and multilingual. The player sees the version she writes versus the version she sends.', relationships:[{targetId:'aguien_patriarch',description:'Married. Loves him. Sees what duty is doing to him.'}], notes:'Alignment 0. The center that cannot hold.' },
      { id:'aguien_heir', name:'The Heir', color:'#b83030', household:'aguien', role:'Imperial loyalist', alignment:4, personality:'Young, convinced, dangerous in the way true believers are dangerous. Sees the empire as civilization itself. Not cruel but certain. Certainty at that age, in that position, with that power, is its own kind of cruelty.', arc:{ act1:'Confident. Makes pronouncements. Dismisses local concerns.', act2:'Events challenge the narrative. Doubles down rather than reconsider.', act3:'The gap between belief and reality becomes untenable.' }, playerInfluence:'The player types documents that cross his desk. His certainty is a readable signal - and a vulnerability.', relationships:[{targetId:'aguien_second',description:'Sibling. Dismisses the Second Child\'s quietness as weakness.'}], notes:'Alignment 4. The household\'s ideological counterweight to the Epaule Matriarch.' },
      { id:'aguien_second', name:'The Second Child', color:'#b83030', household:'aguien', role:'Quiet observer', alignment:0, personality:'Watches. Reads. Does not volunteer opinions. The household assumes this means they have none. They are wrong. The Second Child understands more than anyone gives them credit for. Their silence is not absence but storage.', arc:{ act1:'Background presence. Noticed by the attentive.', act2:'Begins leaving small marks. Not messages exactly. Breadcrumbs.', act3:'What they have been storing becomes relevant. Their choice to speak or stay silent matters.' }, playerInfluence:'The player may notice the Second Child\'s observations if they are paying attention. A cipher channel that opens only to the observant.', relationships:[{targetId:'aguien_heir',description:'Sibling. Loves the Heir. Sees what certainty costs.'}], notes:'Alignment 0. The mirror of the Epaule Younger, but through observation rather than ideology.' },
      { id:'imperial_cousin', name:'The Imperial Cousin', color:'#b83030', household:'aguien', role:'Catalyst, the empire\'s hard edge', alignment:5, personality:'Arrives mid-game. Represents what the empire looks like when it stops being polite. Not a villain in the melodramatic sense. A functionary who believes efficiency is a virtue and mercy is a luxury. His arrival changes the temperature.', arc:{ act1:'Not present.', act2:'Arrives. Everything gets harder. Supervision tightens.', act3:'Becomes the force that demands a final choice from everyone.' }, playerInfluence:'His correspondence is monitored. The player\'s editorial freedom shrinks when he is in the room. His presence is a mechanical constraint.', relationships:[{targetId:'aguien_patriarch',description:'Family. The Ambassador is the velvet glove. The Cousin is the fist inside it.'}], notes:'Alignment 5. Maximum Aurinian. The catalyst that forces the endgame.' },
      { id:'aguien_steward', name:'The Steward', color:'#b83030', household:'aguien', role:'Household manager', alignment:1, personality:'Manages the Aguien household with quiet competence. Loyal to the family, not the empire. Knows where the documents are kept. Knows which doors lock from which side. Practical in the way servants of powerful households learn to be practical.', arc:{ act1:'Background logistics. Ensures correspondence flows.', act2:'Becomes a potential ally or obstacle depending on the player\'s approach.', act3:'His knowledge of the household\'s internal workings becomes strategically critical.' }, playerInfluence:'The Steward controls document access. Building trust with him opens channels. Alienating him closes them.', relationships:[{targetId:'aguien_typist',description:'Works alongside the Aguien typist. Professional respect. Watches them carefully.'}], notes:'Alignment 1. Mildly Aurinian by habit.' },
      { id:'aguien_typist', name:'The Aguien Typist (The Lover)', color:'#c85040', household:'aguien', role:'The other typist, romantic interest', alignment:0, personality:'The player\'s counterpart in the Aguien household. Also a typist. Also making choices about what to type and what to change. The relationship between the two typists is the game\'s emotional core - two people doing the same job for opposing sides, communicating through the only medium they share: typed documents.', arc:{ act1:'Professional contact through shared correspondence duties.', act2:'The cipher language develops. What begins as professional coordination becomes personal.', act3:'The relationship is the back channel. What it carries determines whether peace is possible.' }, playerInfluence:'Everything. The Lover is the player\'s primary relationship. The cipher language they build together is the game\'s central mechanic.', relationships:[{targetId:'player_typist',description:'The relationship. Professional, then personal, then the only thing that matters.'}], notes:'Alignment 0. Determined by the player\'s influence. The emotional center of the game.' },

      { id:'personal_letter_1', title:'Personal Letter to Helvetan Merchant', type:'personal_letter', day:3, act:1, supervision:'unattended', dictatedBy:'epaule_patriarch', addressedTo:'', surfaceText:'My dear colleague, I write regarding the delayed shipment of paper stock. The mill has experienced difficulties I am told are temporary. I trust our arrangement continues to serve us both.', hiddenLayer:{ ciphers:[], encoded:'', method:'', workedExample:'' }, editorialChoices:[], pacing:'routine', notes:'The Patriarch dictates this but the player types it unattended. First opportunity for editorial freedom.' },
      { id:'civic_notice_1', title:'Civic Notice About Paper Mill', type:'official_dictation', day:3, act:1, supervision:'checked', dictatedBy:'epaule_patriarch', addressedTo:'', surfaceText:'NOTICE: The Serennan Paper Mill will resume full operations within the fortnight. Citizens are advised that correspondence supplies will be restocked at the usual merchants. Patience is appreciated during this period of adjustment.', hiddenLayer:{ ciphers:[], encoded:'', method:'', workedExample:'' }, editorialChoices:[], pacing:'routine', notes:'Checked supervision means the Patriarch reads it before it goes out. Limited editorial freedom.' },
      { id:'shipment_delay_1', title:'Shipment Delay Notice (HELP acrostic)', type:'incoming_aguien', day:3, act:1, supervision:'unattended', dictatedBy:'', addressedTo:'epaule_patriarch', surfaceText:'Having reviewed the latest cargo manifest, we find\nExpected quantities do not match the bill of lading.\nLikely this is a clerical error at the border post.\nPlease confirm receipt and advise on discrepancies.', hiddenLayer:{ ciphers:['acrostic'], encoded:'HELP', method:'First letter of each line spells HELP', workedExample:'H-aving, E-xpected, L-ikely, P-lease' }, editorialChoices:[], pacing:'tense', notes:'First hidden message the player encounters. The acrostic is simple enough to notice on a second reading. The question: who sent this, and why?' },
      { id:'border_road_response', title:'Border Road Response', type:'official_dictation', day:47, act:2, supervision:'checked', dictatedBy:'epaule_matriarch', addressedTo:'', surfaceText:'The border road remains under Serennan jurisdiction per the Treaty of the Three Rivers. Any military presence on this road constitutes a violation of that treaty. We demand clarification of intent and immediate withdrawal of personnel to the agreed demarcation line.', hiddenLayer:{ ciphers:[], encoded:'', method:'', workedExample:'' }, editorialChoices:[{ description:'Soften "demand" to "request"', tugEffect:-1, consequence:'Reduces diplomatic tension but weakens Serennan position', requiresCipher:'' },{ description:'Add mention of trade disruption', tugEffect:-0.5, consequence:'Reframes the issue as economic rather than territorial', requiresCipher:'' }], pacing:'crisis', notes:'The Matriarch dictating. Supervision is checked but the Patriarch is distracted. Editorial choices available that shift the tug of war.' },
      { id:'conscription_response', title:'Conscription Response', type:'official_dictation', day:78, act:3, supervision:'close', dictatedBy:'epaule_patriarch', addressedTo:'', surfaceText:'In response to the Imperial Conscription Order dated the 14th: the citizens of this town are not imperial subjects. They are Serennan nationals living under Serennan law in Serennan territory. This office does not recognize the authority of the Aurinian Empire to conscript our people. This letter constitutes formal refusal.', hiddenLayer:{ ciphers:[], encoded:'', method:'', workedExample:'' }, editorialChoices:[{ description:'Include the Patriarch\'s name as signatory', tugEffect:-2, consequence:'Personal commitment. He can\'t take it back. The town has a face.', requiresCipher:'' },{ description:'Reference the back-channel peace agreement', tugEffect:-3, consequence:'Reveals the cipher correspondence. Maximum peace effect but exposes everything.', requiresCipher:'word_substitution' }], pacing:'climactic', notes:'The climactic document. Close supervision. The Patriarch is watching every keystroke. The player\'s accumulated cipher knowledge and editorial skill are tested.' },

// =====================================================
// RENDER: OVERVIEW
// =====================================================
function renderOverview() {
  const tab = document.getElementById('tab-overview');
  let html = '';

  html += `<h2 style="margin-bottom:4px">Ink Ribbon</h2>`;
  html += `<div class="overview-premise">`;
  html += `<p>A narrative design tool for <strong>Ink Ribbon</strong>, a game about two typists on opposite sides of a political crisis, communicating through hidden messages embedded in official correspondence. The player types dictated documents for one household in a border town. What they choose to include, omit, alter, or encode in those documents determines whether the town moves toward peace or war.</p>`;
  html += `<p style="margin-top:10px;color:var(--text2);font-size:12px">The core mechanic is the typewriter. The core verb is editorial discretion. The core relationship is built through a Secret Language of ciphers that the player and their counterpart develop over 80 days.</p>`;
  html += `</div>`;

  // Stat cards
  html += `<div class="export-stats">`;
  html += `<div class="stat-card"><div class="stat-num">${data.characters.length}</div><div class="stat-label">Characters</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.documents.length}</div><div class="stat-label">Documents</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.ciphers.length}</div><div class="stat-label">Ciphers</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.days.length}</div><div class="stat-label">Days Planned</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.forces.length}</div><div class="stat-label">Forces</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.indicators.length}</div><div class="stat-label">Indicators</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${data.stages.length}</div><div class="stat-label">Language Stages</div></div>`;
  html += `</div>`;

  // Validation warnings
  const issues = getValidationIssues();
  if (issues.length) {
    html += `<div class="validation-group"><h4>Validation Warnings <span class="v-count ${issues.some(i=>i.level==='fail')?'v-fail':'v-warn'}">${issues.length}</span></h4>`;
    issues.forEach(i => {
      const cls = i.level === 'fail' ? 'var(--red)' : 'var(--accent3)';
      html += `<div class="v-item" style="border-left-color:${cls}"><span style="color:${cls}">${i.level === 'fail' ? 'ERROR' : 'WARN'}:</span> ${esc(i.msg)}</div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="v-item" style="border-left-color:var(--green);margin-bottom:16px"><span style="color:var(--green)">All checks passed.</span></div>`;
  }

  // Workflow guide
  html += `<div class="detail-section"><h4>Workflow</h4>`;
  const steps = [
    { tab:'characters', label:'Households', desc:'Define the 14 characters across two households. Set political alignments, relationships, personality.' },
    { tab:'documents', label:'Documents', desc:'Author surface text and hidden layers for each key document. Assign supervision levels and editorial choices.' },
    { tab:'ciphers', label:'Ciphers', desc:'Design the 8 cipher methods across daylight, candlelight, and physical channels. Set discovery conditions.' },
    { tab:'days', label:'Day Planner', desc:'Plan the 80-day timeline. Assign documents and ciphers to specific days. Set pacing.' },
    { tab:'tugofwar', label:'Tug of War', desc:'Balance the forces pushing toward peace and war. Simulate the cumulative effect of player choices.' },
    { tab:'window', label:'Street Window', desc:'Define 10 visual indicators the player sees from their window. Map each to tug-of-war thresholds.' },
    { tab:'language', label:'Secret Language', desc:'Design the 5-stage pipeline from calibration to dialogue. Place anomalies that teach each cipher.' },
    { tab:'export', label:'Export', desc:'Full validation. Export data. Review the complete design.' },
  ];
  steps.forEach((s, i) => {
    html += `<div class="workflow-step" onclick="switchTab('${s.tab}')"><div class="ws-num">${i+1}</div><div class="ws-text"><strong>${esc(s.label)}</strong><br>${esc(s.desc)}</div></div>`;
  });
  html += `</div>`;

  tab.innerHTML = html;
}
