<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VG101</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f0;
      --text: #2c2c2c;
      --text-muted: #6a6456;
      --rule: #d5cdb8;
      --accent-gold: #c49a2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .plate {
      width: 100%;
      max-width: 620px;
      text-align: center;
      padding: 3rem 1rem;
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2.25rem;
    }
    .wordmark {
      font-family: 'Lora', Georgia, serif;
      font-weight: 600;
      font-size: clamp(3.5rem, 12vw, 6rem);
      letter-spacing: 0.01em;
      line-height: 1;
      color: var(--text);
    }
    .wordmark .num { color: var(--accent-gold); }
    .rule {
      width: 44px;
      height: 1px;
      background: var(--accent-gold);
      margin: 1.75rem auto;
      opacity: 0.7;
    }
    .lede {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.2rem;
      font-style: italic;
      color: var(--text-muted);
      line-height: 1.55;
      max-width: 30rem;
      margin: 0 auto 2.5rem;
    }
    .status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 3rem;
    }
    .home-link {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .home-link:hover { color: var(--text); border-bottom-color: var(--accent-gold); }
  </style>
</head>
<body>
  <main class="plate">
    <div class="eyebrow">A Videogame Design Text</div>
    <div class="wordmark">VG<span class="num">101</span></div>
    <div class="rule"></div>
    <p class="lede">Built on Gesture and Aesthetic Heritage, a way to understand videogames as their own medium.</p>
    <div class="status">Coming Soon</div>
    <a href="../index.html" class="home-link">&larr; Return to marty64.net</a>
  </main>
</body>
</html>
