<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210">
  <!-- Parchment background -->
  <rect width="480" height="210" fill="#faf8f0"/>

  <!-- Top amber header strip -->
  <rect width="480" height="27" fill="#c49a2e"/>
  <text x="240" y="17" font-size="9" font-family="system-ui, -apple-system, sans-serif" font-weight="600"
        fill="#fff8e0" text-anchor="middle" letter-spacing="2">VG101 KNOWLEDGE BASE</text>

  <!-- Vertical column divider -->
  <line x1="242" y1="33" x2="242" y2="203" stroke="#d5cdb8" stroke-width="1"/>

  <!-- Bottom rule -->
  <line x1="0" y1="204" x2="480" y2="204" stroke="#d5cdb8" stroke-width="1"/>

  <!-- LEFT COLUMN ───────────────────────── -->
  <!-- Title -->
  <text x="18" y="75" font-size="43" font-weight="700" fill="#1e1e1e"
        font-family="Georgia, 'Times New Roman', serif">VG101</text>

  <!-- Italic subtitle -->
  <text x="18" y="90" font-size="11" font-style="italic" fill="#5a5a5a"
        font-family="Georgia, 'Times New Roman', serif">Videogame Design</text>

  <!-- Thin rule -->
  <line x1="18" y1="97" x2="232" y2="97" stroke="#d5cdb8" stroke-width="1"/>

  <!-- Framework tagline -->
  <text x="18" y="111" font-size="10" fill="#c49a2e" letter-spacing="0.3"
        font-family="Georgia, 'Times New Roman', serif">Gesture + Aesthetic Heritage</text>

  <!-- Body description -->
  <text x="18" y="129" font-size="9" fill="#5a5a5a"
        font-family="system-ui, -apple-system, sans-serif">The surface area of contact between</text>
  <text x="18" y="142" font-size="9" fill="#5a5a5a"
        font-family="system-ui, -apple-system, sans-serif">player and videogame. Analyzed through</text>
  <text x="18" y="155" font-size="9" fill="#5a5a5a"
        font-family="system-ui, -apple-system, sans-serif">Action, Art, Arc, and Atmosphere.</text>


  <!-- RIGHT COLUMN: table of contents ──── -->
  <!-- CORE FRAMEWORK -->
  <text x="256" y="48" font-size="7" fill="#c49a2e" letter-spacing="1.5" font-weight="600"
        font-family="system-ui, -apple-system, sans-serif">CORE FRAMEWORK</text>
  <text x="262" y="61"  font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">Gesture</text>
  <text x="262" y="74"  font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">The 4 A&#x2019;s</text>
  <text x="262" y="87"  font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">Aesthetic Heritage</text>
  <text x="262" y="100" font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">Permissions</text>

  <!-- FOUNDATIONS -->
  <text x="256" y="116" font-size="7" fill="#c49a2e" letter-spacing="1.5" font-weight="600"
        font-family="system-ui, -apple-system, sans-serif">FOUNDATIONS</text>
  <text x="262" y="129" font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">What Makes a Videogame</text>
  <text x="262" y="142" font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">Player Psychology</text>
  <text x="262" y="155" font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">The Design Lens</text>

  <!-- CASE STUDIES -->
  <text x="256" y="171" font-size="7" fill="#c49a2e" letter-spacing="1.5" font-weight="600"
        font-family="system-ui, -apple-system, sans-serif">CASE STUDIES</text>
  <text x="262" y="184" font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">Celeste &#xb7; Dark Souls &#xb7; Hades</text>
  <text x="262" y="197" font-size="9.5" fill="#2c2c2c" font-family="Georgia, 'Times New Roman', serif">Portal &#xb7; Undertale</text>
</svg>
